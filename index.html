<script>
(function(){
  try{
    const s=localStorage.getItem('start_app');
    if(s){const p=JSON.parse(s);if(p.settings&&p.settings.theme)applyTheme(p.settings.theme,true);}
  }catch(e){}
  window.applyTheme=function(theme,silent){
    const r=document.documentElement;
    const T={
      light:{'--bg':'#FAF6F1','--bg-soft':'#F3ECE2','--surface':'#FFFFFF','--surface-2':'#FDFBF8','--ink':'#2B2A28','--ink-2':'#5A564F','--ink-3':'#8A857E','--line':'#EDE7DF','--line-2':'#E3DBCF','--accent':'#E0856F','--accent-2':'#C96E59','--accent-soft':'#FCEAE3','--accent-halo':'#F2A892','--sage':'#A8B89A','--sage-2':'#5C7050','--sage-soft':'#E8EFE1','--nav-bg':'rgba(255,255,255,0.85)','--nav-border':'#EDE7DF','--nav-text':'#5A564F','--nav-text-active':'#FFFFFF','--nav-bg-active':'#2B2A28','--gold':'#D4A574','--gold-soft':'#F5E6D3'},
      night:{'--bg':'#1a1816','--bg-soft':'#252220','--surface':'#2a2724','--surface-2':'#2f2c29','--ink':'#F5E9DC','--ink-2':'#D4C8B8','--ink-3':'#8A857E','--line':'#3a3632','--line-2':'#4a4540','--accent':'#E0856F','--accent-2':'#C96E59','--accent-soft':'#3d2a24','--accent-halo':'#F2A892','--sage':'#A8B89A','--sage-2':'#C5D4B8','--sage-soft':'#2a3326','--nav-bg':'rgba(24,24,27,0.92)','--nav-border':'#27272A','--nav-text':'#A1A1AA','--nav-text-active':'#FFFFFF','--nav-bg-active':'#E0856F','--gold':'#D4A574','--gold-soft':'#3d3024'},
      galaxy:{'--bg':'#1a1a2e','--bg-soft':'#252540','--surface':'#2a2a45','--surface-2':'#2f2f4a','--ink':'#F5E9DC','--ink-2':'#D4C8B8','--ink-3':'#9a95a8','--line':'#3a3a55','--line-2':'#4a4a65','--accent':'#E0856F','--accent-2':'#C96E59','--accent-soft':'#3d2a35','--accent-halo':'#F2A892','--sage':'#A8B89A','--sage-2':'#C5D4B8','--sage-soft':'#2a3335','--nav-bg':'rgba(22,25,44,0.92)','--nav-border':'#2E3454','--nav-text':'#CBD5E1','--nav-text-active':'#FFFFFF','--nav-bg-active':'#E0856F','--gold':'#D4A574','--gold-soft':'#3d2a35'},
      warm:{'--bg':'#F5EDE0','--bg-soft':'#EDE0CC','--surface':'#FFF8EE','--surface-2':'#FFF5E8','--ink':'#3a2e22','--ink-2':'#6b5a48','--ink-3':'#9a8870','--line':'#E8D8C0','--line-2':'#DCC8A8','--accent':'#C96E59','--accent-2':'#A85845','--accent-soft':'#F5D8C8','--accent-halo':'#E89878','--sage':'#9a8a6a','--sage-2':'#6b5e48','--sage-soft':'#E8DCC0','--nav-bg':'rgba(255,248,238,0.9)','--nav-border':'#E8D8C0','--nav-text':'#6b5a48','--nav-text-active':'#FFFFFF','--nav-bg-active':'#3a2e22','--gold':'#B8864E','--gold-soft':'#F0DCC0'}
    };
    const t=T[theme]||T.light;
    Object.entries(t).forEach(([k,v])=>r.style.setProperty(k,v));
    if(!silent){const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t['--bg'];}
    document.body.className=theme==='light'?'':'theme-'+theme;
  };
})();
</script>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
:root{
  --bg:#FAF6F1;--bg-soft:#F3ECE2;--surface:#FFFFFF;--surface-2:#FDFBF8;
  --ink:#2B2A28;--ink-2:#5A564F;--ink-3:#8A857E;
  --line:#EDE7DF;--line-2:#E3DBCF;
  --accent:#E0856F;--accent-2:#C96E59;--accent-soft:#FCEAE3;--accent-halo:#F2A892;
  --sage:#A8B89A;--sage-2:#5C7050;--sage-soft:#E8EFE1;
  --nav-bg:rgba(255,255,255,0.85);--nav-border:#EDE7DF;
  --nav-text:#5A564F;--nav-text-active:#FFFFFF;--nav-bg-active:#2B2A28;
  --gold:#D4A574;--gold-soft:#F5E6D3;
  --shadow-sm:0 1px 2px rgba(60,45,30,0.04),0 2px 8px rgba(60,45,30,0.04);
  --shadow-md:0 2px 6px rgba(60,45,30,0.05),0 10px 28px rgba(60,45,30,0.08);
  --shadow-lg:0 8px 24px rgba(60,45,30,0.08),0 24px 60px rgba(60,45,30,0.12);
  --radius-sm:12px;--radius-md:18px;--radius-lg:28px;
  --ease:cubic-bezier(.2,.7,.2,1);
  --nav-height:64px;
}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-bottom:calc(var(--nav-height) + 12px + env(safe-area-inset-bottom));transition:background .4s var(--ease),color .4s var(--ease);}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(1200px 600px at 85% -10%,rgba(224,133,111,0.08),transparent 60%),radial-gradient(900px 500px at -10% 20%,rgba(168,184,154,0.08),transparent 60%);pointer-events:none;z-index:0;}
body.theme-galaxy::before{background:radial-gradient(1200px 600px at 85% -10%,rgba(224,133,111,0.12),transparent 60%),radial-gradient(900px 500px at -10% 20%,rgba(168,184,154,0.08),transparent 60%);}
body.theme-galaxy::after{content:"";position:fixed;inset:0;background-image:radial-gradient(1px 1px at 20% 30%,rgba(255,255,255,0.3),transparent),radial-gradient(1px 1px at 60% 70%,rgba(255,255,255,0.2),transparent),radial-gradient(1px 1px at 80% 20%,rgba(255,255,255,0.25),transparent),radial-gradient(1px 1px at 40% 80%,rgba(255,255,255,0.15),transparent),radial-gradient(1px 1px at 90% 60%,rgba(255,255,255,0.2),transparent);background-size:100% 100%;pointer-events:none;z-index:0;animation:twinkle 8s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:0.4;}50%{opacity:1;}}
@media(prefers-reduced-motion:reduce){body.theme-galaxy::after{animation:none;}}
.app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:32px 24px 40px;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:36px;flex-wrap:wrap;gap:12px;}
.brand{display:flex;align-items:center;gap:12px;}
.brand-mark{width:44px;height:44px;display:grid;place-items:center;flex-shrink:0;}
.brand-mark svg{width:100%;height:100%;}
.brand-name{font-family:'Caveat',cursive;font-size:36px;font-weight:700;color:var(--ink);letter-spacing:0.5px;line-height:1;}
.brand-tag{font-size:12px;color:var(--ink-3);font-weight:500;letter-spacing:0.5px;margin-top:2px;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.status-pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;color:var(--ink-2);font-weight:500;}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--sage);box-shadow:0 0 0 3px var(--sage-soft);}
.status-brand{font-family:'Caveat',cursive;font-weight:700;font-size:18px;color:var(--ink);letter-spacing:0.3px;line-height:1;}
.page-head{margin-bottom:28px;}
.page-title{font-family:'Caveat',cursive;font-size:52px;font-weight:700;line-height:1.05;color:var(--ink);margin-bottom:8px;}
.page-subtitle{font-size:16px;color:var(--ink-3);max-width:520px;}
.view{display:none;animation:fadeUp .45s var(--ease);}
.view.active{display:block;}
.view-content{padding-bottom:calc(var(--nav-height) + 24px + env(safe-area-inset-bottom));}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-sm);transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .25s var(--ease);}
.card+.card{margin-top:16px;}
.card:hover{box-shadow:var(--shadow-md);}
.section-label{font-size:12px;font-weight:600;letter-spacing:1.2px;color:var(--ink-3);text-transform:uppercase;margin-bottom:14px;}
.tasks-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));}
.task-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:20px;cursor:pointer;transition:all .25s var(--ease);position:relative;overflow:hidden;}
.task-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:transparent;transition:background .25s var(--ease);}
.task-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--line-2);}
.task-card:hover::before{background:var(--accent);}
.task-card.selected{border-color:var(--accent);background:linear-gradient(180deg,var(--surface) 0%,var(--accent-soft) 100%);box-shadow:var(--shadow-md);}
.task-card.selected::before{background:var(--accent);}
.task-card.done{opacity:0.55;}
.task-title{font-size:17px;font-weight:600;color:var(--ink);margin-bottom:6px;}
.task-meta{display:flex;gap:14px;align-items:center;font-size:13px;color:var(--ink-3);flex-wrap:wrap;}
.task-meta span{display:inline-flex;align-items:center;gap:6px;}
.task-actions{display:flex;gap:8px;margin-top:14px;opacity:0;transform:translateY(4px);transition:all .25s var(--ease);}
.task-card:hover .task-actions,.task-card.selected .task-actions{opacity:1;transform:translateY(0);}
.icon-btn{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);cursor:pointer;display:grid;place-items:center;transition:all .2s var(--ease);}
.icon-btn:hover{background:var(--accent-soft);color:var(--accent-2);border-color:var(--accent-soft);}
.icon-btn.danger:hover{background:#FBEAEA;color:#B84A4A;border-color:#F5D5D5;}
.icon-btn svg{width:14px;height:14px;}
.empty-state{text-align:center;padding:60px 24px;background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--radius-lg);}
.empty-state .empty-icon{width:56px;height:56px;margin:0 auto 16px;border-radius:50%;background:var(--sage-soft);display:grid;place-items:center;color:var(--sage-2);}
.empty-state .empty-icon svg{width:28px;height:28px;}
.empty-state h3{font-family:'Caveat',cursive;font-size:28px;color:var(--ink);margin-bottom:6px;}
.empty-state p{color:var(--ink-3);font-size:14px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:999px;border:1px solid transparent;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s var(--ease);text-decoration:none;white-space:nowrap;min-height:44px;}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(224,133,111,0.35),inset 0 1px 0 rgba(255,255,255,0.25);}
.btn-primary:hover{background:var(--accent-2);box-shadow:0 6px 18px rgba(201,110,89,0.4);}
.btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line);}
.btn-ghost:hover{background:var(--bg-soft);border-color:var(--line-2);}
.btn-lg{padding:16px 30px;font-size:15px;}
.btn svg{width:16px;height:16px;}
.prepare-layout{display:grid;gap:20px;grid-template-columns:1fr;}

.input-row{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:12px 18px;transition:all .2s var(--ease);}
.input-row:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(224,133,111,0.12);}
.input-row input{flex:1;border:none;outline:none;background:transparent;font-family:inherit;font-size:16px;color:var(--ink);padding:0;}
.input-row input::placeholder{color:var(--ink-3);}
.duration-row{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);cursor:pointer;transition:all .2s var(--ease);min-height:52px;}
.duration-row:hover{border-color:var(--accent);background:var(--accent-soft);}
.duration-row .dur-label{font-size:13px;color:var(--ink-3);text-transform:uppercase;letter-spacing:1px;font-weight:600;}
.duration-row .dur-value{font-family:'Caveat',cursive;font-size:24px;font-weight:700;color:var(--ink);}
.duration-row .dur-arrow{color:var(--ink-3);font-size:18px;}
.templates-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));}
.template-chip{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:14px 16px;cursor:pointer;text-align:left;transition:all .2s var(--ease);font-family:inherit;display:flex;flex-direction:column;gap:4px;position:relative;}
.template-chip:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px);}
.template-chip .t-icon{width:32px;height:32px;border-radius:10px;background:var(--bg-soft);display:grid;place-items:center;color:var(--ink-2);margin-bottom:4px;}
.template-chip .t-icon svg{width:18px;height:18px;}
.template-chip .t-name{font-size:14px;font-weight:600;color:var(--ink);}
.template-chip .t-sub{font-size:12px;color:var(--ink-3);}
.template-chip .quick-start{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;border:none;cursor:pointer;display:grid;place-items:center;opacity:0;transform:scale(0.8);transition:all .2s var(--ease);}
.template-chip:hover .quick-start{opacity:1;transform:scale(1);}
.template-chip .quick-start svg{width:14px;height:14px;}
.prepare-actions{position:sticky;bottom:calc(var(--nav-height) + 12px + env(safe-area-inset-bottom));background:var(--bg);padding:12px 0;margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;z-index:10;border-top:1px solid var(--line);}
.steps-editor{margin-top:8px;}
.step-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:8px;transition:all .2s var(--ease);}
.step-num{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent-2);font-size:12px;font-weight:700;display:grid;place-items:center;flex-shrink:0;}
.step-text{flex:1;border:none;background:transparent;font-family:inherit;font-size:14px;color:var(--ink);outline:none;}
.step-remove{width:26px;height:26px;border-radius:8px;border:none;background:transparent;color:var(--ink-3);cursor:pointer;display:grid;place-items:center;transition:all .2s var(--ease);}
.step-remove:hover{background:#FBEAEA;color:#B84A4A;}
.step-remove svg{width:14px;height:14px;}
.add-step-btn{width:100%;padding:10px;border:1px dashed var(--line-2);border-radius:var(--radius-sm);background:transparent;color:var(--ink-3);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s var(--ease);}
.add-step-btn:hover{border-color:var(--accent);color:var(--accent-2);background:var(--accent-soft);}
.device-layout{display:grid;gap:28px;grid-template-columns:1fr;align-items:start;}
@media(min-width:860px){.device-layout{grid-template-columns:1fr 1fr;}}
.device-stage{display:flex;flex-direction:column;align-items:center;padding:20px 10px;}
.device{width:280px;background:linear-gradient(160deg,#3a3632 0%,#1f1d1b 100%);border-radius:50%;aspect-ratio:1;padding:28px;box-shadow:inset 0 2px 4px rgba(255,255,255,0.08),inset 0 -4px 12px rgba(0,0,0,0.4),0 20px 50px rgba(40,30,20,0.3),0 4px 12px rgba(40,30,20,0.2);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;}
.device::before{content:"";position:absolute;inset:8px;border-radius:50%;border:1px solid rgba(255,255,255,0.04);pointer-events:none;}
.progress-ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:220px;height:220px;pointer-events:none;z-index:1;}
.progress-ring circle{fill:none;stroke-width:5;}
.progress-ring .track{stroke:rgba(255,255,255,0.08);}
.progress-ring .fill{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:565;stroke-dashoffset:565;transition:stroke-dashoffset 0.3s linear;transform:rotate(-90deg);transform-origin:center;filter:drop-shadow(0 0 6px rgba(224,133,111,0.5));}
.progress-ring .fill.complete{stroke:var(--sage);filter:drop-shadow(0 0 6px rgba(168,184,154,0.5));}
.device-screen{width:100%;background:#0a0908;border-radius:24px;padding:18px 16px;color:#F5E9DC;text-align:center;box-shadow:inset 0 2px 6px rgba(0,0,0,0.6);min-height:110px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;z-index:2;}
.device-screen::after{content:"";position:absolute;top:0;left:0;right:0;height:40%;background:linear-gradient(180deg,rgba(255,255,255,0.04),transparent);pointer-events:none;}
.device-label{font-size:10px;letter-spacing:2px;color:#8A857E;text-transform:uppercase;margin-bottom:4px;}
.device-task{font-family:'Caveat',cursive;font-size:22px;font-weight:600;color:#F5E9DC;line-height:1.2;margin-bottom:6px;min-height:28px;}
.device-step{font-size:13px;color:#B8AFA2;margin-bottom:8px;min-height:18px;}
.device-progress{display:flex;gap:4px;justify-content:center;}
.device-progress .pip{width:6px;height:6px;border-radius:50%;background:#3a3632;transition:all .3s var(--ease);}
.device-progress .pip.done{background:var(--accent);}
.device-progress .pip.current{background:#F5E9DC;box-shadow:0 0 8px rgba(245,233,220,0.6);}
.start-button{width:110px;height:110px;border-radius:50%;border:none;background:radial-gradient(circle at 30% 30%,var(--accent-halo) 0%,var(--accent) 45%,var(--accent-2) 100%);color:#fff;font-family:'Caveat',cursive;font-size:28px;font-weight:700;cursor:pointer;position:relative;z-index:2;box-shadow:inset 0 2px 4px rgba(255,255,255,0.35),inset 0 -4px 10px rgba(0,0,0,0.25),0 8px 20px rgba(224,133,111,0.5),0 0 0 6px rgba(224,133,111,0.12);transition:transform .1s var(--ease),box-shadow .2s var(--ease);letter-spacing:1px;user-select:none;}
.start-button:hover{transform:scale(1.03);}
.start-button:active{transform:scale(0.94);}
.start-button.pulse{animation:btnPulse 1.6s ease-in-out infinite;}
@keyframes btnPulse{0%,100%{box-shadow:inset 0 2px 4px rgba(255,255,255,0.35),inset 0 -4px 10px rgba(0,0,0,0.25),0 8px 20px rgba(224,133,111,0.5),0 0 0 6px rgba(224,133,111,0.12);}50%{box-shadow:inset 0 2px 4px rgba(255,255,255,0.35),inset 0 -4px 10px rgba(0,0,0,0.25),0 8px 20px rgba(224,133,111,0.5),0 0 0 18px rgba(224,133,111,0);}}
.start-button.breathing{animation:breathe 2.5s ease-in-out infinite;}
@keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
.start-button.glow{animation:glow 0.5s ease-out;}
@keyframes glow{0%{filter:brightness(1);}50%{filter:brightness(1.4);}100%{filter:brightness(1);}}
.device-hint{margin-top:20px;font-size:13px;color:var(--ink-3);text-align:center;max-width:280px;line-height:1.5;}
.session-controls{display:flex;gap:8px;margin-bottom:16px;opacity:0;pointer-events:none;transition:opacity .3s var(--ease);flex-wrap:wrap;justify-content:center;}
.session-controls.visible{opacity:1;pointer-events:auto;}
.session-ctrl-btn{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s var(--ease);min-height:44px;}
.session-ctrl-btn:hover{background:var(--bg-soft);color:var(--ink);}
.session-ctrl-btn.quit:hover{background:#FBEAEA;color:#B84A4A;border-color:#F5D5D5;}
.session-ctrl-btn.block-btn{background:var(--accent-soft);color:var(--accent-2);border-color:var(--accent-soft);}
.session-ctrl-btn.block-btn:hover{background:var(--accent);color:#fff;}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);}
.setting-row:last-child{border-bottom:none;}
.setting-info{flex:1;}

  .status-brand{font-size:16px;}
  .device{width:240px;padding:22px;}
  .progress-ring{width:190px;height:190px;}
  .start-button{width:96px;height:96px;font-size:24px;}

  .duration-display{font-size:40px;}
  .block-intro .page-title{font-size:40px;}
  .quests-header{flex-direction:column;align-items:stretch;}
  .quests-points{justify-content:center;}
}
button:focus-visible,input:focus-visible,.task-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3);}

<body>
<!-- ... (Le reste du HTML reste strictement identique, je ne le répète pas pour économiser de l'espace, mais il doit être inclus dans ton fichier final) ... -->
<!-- Assure-toi de copier l'intégralité du bloc HTML de la réponse précédente pour la structure, et remplace UNIQUEMENT la balise <script> par celle ci-dessous. -->

<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').then(reg=>{reg.addEventListener('updatefound',()=>{const nw=reg.installing;nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)toast('Nouvelle version disponible, actualiser');});});}).catch(e=>console.log('SW failed:',e));}

const DB_NAME='start_app',STORAGE_KEY='start_app';
const DEFAULT_STATE={
  tasks:[],
  settings:{sound:'bell',vibration:true,wakeLock:false,demo:true,theme:'light',defaultDuration:5,tone:'warm'},
  // CORRECTION P3 : Ajout des champs pour suivre le temps réel et l'état
  session:{taskId:null,stepIndex:0,isActive:false,isPaused:false,remainingTime:0,activeTimeAccumulated:0,lastActiveAt:null,startedAt:null,lastSaved:null},
  onboarding:{completed:false,currentScreen:0,answers:{}},
  blockUsage:{noIdea:0,tooBig:0,tired:0},blockLearned:{},
  quests:{points:0,level:1,daily:{date:null,progress:{},completed:[]},weekly:{weekStart:null,progress:{},completed:[]},special:{completed:[]},history:[]},
  journey:{sessions:[],daysUsed:[]}
};
let state=structuredClone(DEFAULT_STATE);
let db=null,wakeLock=null,timerInterval=null,audioCtx=null;
let sheetMinutes=5,prepareDuration=5,prepareFree=false,prepareSteps=[];

// --- CORRECTION P1 : IndexedDB robuste et cohérente ---
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,2);r.onupgradeneeded=e=>{const d=e.target.result;// CORRECTION : keyPath: 'id' partout
if(!d.objectStoreNames.contains('tasks'))d.createObjectStore('tasks',{keyPath:'id'});if(!d.objectStoreNames.contains('settings'))d.createObjectStore('settings',{keyPath:'id'});if(!d.objectStoreNames.contains('session'))d.createObjectStore('session',{keyPath:'id'});if(!d.objectStoreNames.contains('onboarding'))d.createObjectStore('onboarding',{keyPath:'id'});if(!d.objectStoreNames.contains('quests'))d.createObjectStore('quests',{keyPath:'id'});if(!d.objectStoreNames.contains('journey'))d.createObjectStore('journey',{keyPath:'id'});};r.onsuccess=e=>res(e.target.result);r.onerror=e=>rej(e);});}

async function dbGet(s,k){if(!db)return null;return new Promise(r=>{try{const tx=db.transaction(s,'readonly'),req=tx.objectStore(s).get(k);req.onsuccess=()=>r(req.result?req.result.value:null);req.onerror=()=>r(null);}catch(e){r(null);}});}

async function dbPut(s,k,v){if(!db)return;return new Promise(r=>{try{const tx=db.transaction(s,'readwrite');// CORRECTION : correspond au keyPath: 'id'
tx.objectStore(s).put({id:k, value:v});tx.oncomplete=()=>r();tx.onerror=()=>r();}catch(e){r();}});}

async function dbClear(s){if(!db)return;return new Promise(r=>{try{const tx=db.transaction(s,'readwrite');tx.objectStore(s).clear();tx.oncomplete=()=>r();tx.onerror=()=>r();}catch(e){r();}});}

async function dbAllTasks(){if(!db)return[];return new Promise(r=>{try{const tx=db.transaction('tasks','readonly'),req=tx.objectStore('tasks').getAll();req.onsuccess=()=>r(req.result.map(x=>x.value));req.onerror=()=>r([]);}catch(e){r([]);}});}

function todayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function weekStartKey(){const d=new Date(),day=d.getDay(),diff=d.getDate()-day+(day===0?-6:1),m=new Date(d.setDate(diff));return `${m.getFullYear()}-${String(m.getMonth()+1).padStart(2,'0')}-${String(m.getDate()).padStart(2,'0')}`;}

async function loadState(){
  try{
    db=await openDB();
    state.tasks=(await dbAllTasks())||[];
    const s=await dbGet('settings','main'),se=await dbGet('session','main'),o=await dbGet('onboarding','main'),q=await dbGet('quests','main'),j=await dbGet('journey','main');
    if(s)state.settings={...DEFAULT_STATE.settings,...s};
    if(se)state.session={...DEFAULT_STATE.session,...se};
    if(o)state.onboarding={...DEFAULT_STATE.onboarding,...o};
    if(q)state.quests={...DEFAULT_STATE.quests,...q};
    if(j)state.journey={...DEFAULT_STATE.journey,...j};
    if(state.settings.defaultDuration>360)state.settings.defaultDuration=5;
    checkQuestsReset();
    
    // CORRECTION P3-D : Reprise fiable du temps après fermeture
    if(state.session.isActive && !state.session.isPaused && state.session.lastActiveAt) {
      const elapsed = Date.now() - state.session.lastActiveAt;
      if(state.session.remainingTime > 0) {
        state.session.remainingTime = Math.max(0, state.session.remainingTime - elapsed);
        state.session.activeTimeAccumulated += elapsed;
        if(state.session.remainingTime <= 0) {
          state.session.isActive = false;
          state.session.remainingTime = 0;
        }
      }
      state.session.lastActiveAt = Date.now();
    }
    
    if(navigator.storage?.persist){const p=await navigator.storage.persisted();if(!p)try{await navigator.storage.persist();}catch(e){}}
  }catch(e){
    try{
      const r=localStorage.getItem(STORAGE_KEY);
      if(r){
        const p=JSON.parse(r);
        // CORRECTION P1 : Ne jamais remplacer par état vide si la lecture échoue partiellement
        state={...structuredClone(DEFAULT_STATE),...p,settings:{...DEFAULT_STATE.settings,...(p.settings||{})},session:{...DEFAULT_STATE.session,...(p.session||{})},onboarding:{...DEFAULT_STATE.onboarding,...(p.onboarding||{})},blockUsage:{...DEFAULT_STATE.blockUsage,...(p.blockUsage||{})},blockLearned:{...(p.blockLearned||{})},quests:{...DEFAULT_STATE.quests,...(p.quests||{})},journey:{...DEFAULT_STATE.journey,...(p.journey||{})}};
        if(state.settings.defaultDuration>360)state.settings.defaultDuration=5;
        checkQuestsReset();
      }
    }catch(e2){}
  }
}

function checkQuestsReset(){const t=todayKey(),w=weekStartKey();if(state.quests.daily.date!==t)state.quests.daily={date:t,progress:{},completed:[]};if(state.quests.weekly.weekStart!==w)state.quests.weekly={weekStart:w,progress:{},completed:[]};}

async function saveTasks(){if(db){await dbClear('tasks');for(const t of state.tasks)await dbPut('tasks',t.id,t);}try{const r=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');r.tasks=state.tasks;localStorage.setItem(STORAGE_KEY,JSON.stringify(r));}catch(e){}}
async function saveSettings(){if(db)await dbPut('settings','main',state.settings);try{const r=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');r.settings=state.settings;localStorage.setItem(STORAGE_KEY,JSON.stringify(r));}catch(e){}}

// CORRECTION P3-B & D : Sauvegarde du temps actif réel avant fermeture
async function saveSession(){
  if(state.session.isActive && !state.session.isPaused && state.session.lastActiveAt) {
    const elapsed = Date.now() - state.session.lastActiveAt;
    state.session.activeTimeAccumulated += elapsed;
  }
  state.session.lastSaved = Date.now();
  state.session.lastActiveAt = Date.now(); // Met à jour pour la prochaine reprise
  
  if(db)await dbPut('session','main',state.session);
  try{const r=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');r.session=state.session;localStorage.setItem(STORAGE_KEY,JSON.stringify(r));}catch(e){}
}

async function saveOnboarding(){if(db)await dbPut('onboarding','main',state.onboarding);try{const r=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');r.onboarding=state.onboarding;localStorage.setItem(STORAGE_KEY,JSON.stringify(r));}catch(e){}}
async function saveBlockUsage(){try{const r=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');r.blockUsage=state.blockUsage;r.blockLearned=state.blockLearned;localStorage.setItem(STORAGE_KEY,JSON.stringify(r));}catch(e){}}
async function saveQuests(){if(db)await dbPut('quests','main',state.quests);try{const r=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');r.quests=state.quests;localStorage.setItem(STORAGE_KEY,JSON.stringify(r));}catch(e){}}
async function saveJourney(){if(db)await dbPut('journey','main',state.journey);try{const r=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');r.journey=state.journey;localStorage.setItem(STORAGE_KEY,JSON.stringify(r));}catch(e){}}

// ... (Le reste des fonctions de rendu et d'icônes reste strictement identique à la version précédente) ...
// Pour des raisons de longueur, je conserve la logique de renderTasks, renderTemplates, etc. telle quelle.
// Assure-toi d'inclure tout le bloc de fonctions de rendu de la réponse précédente ici.

// CORRECTION P3-A : Logique de clic START robuste
function handleStartClick(){
  const task=getCurrentTask();if(!task)return;
  
  // 1. Session non commencée
  if(!state.session.isActive){
    startSession();
    updateQuestProgress({type:'sessionStarted'});
    return;
  }
  
  // 2. Session en pause
  if(state.session.isPaused){
    resumeSession();
    return;
  }
  
  // 3. Session active (libre ou chronométrée) -> valider l'étape
  validateStep();
}

function startSession(){
  const task=getCurrentTask();if(!task)return;
  const d=task.duration>0?task.duration*60*1000:0; // en ms
  
  state.session.isActive = true;
  state.session.isPaused = false;
  state.session.remainingTime = d;
  state.session.activeTimeAccumulated = 0;
  state.session.lastActiveAt = Date.now();
  state.session.startedAt = Date.now();
  
  saveSession();renderDevice();
  if(d>0)startTimer();
  if(state.settings.wakeLock)requestWakeLock();
  if(state.settings.vibration&&navigator.vibrate)navigator.vibrate(30);
  startBtn.classList.add('glow');setTimeout(()=>startBtn.classList.remove('glow'),500);
}

function validateStep(){
  const task=getCurrentTask();if(!task)return;
  if(state.session.stepIndex<task.steps.length-1){
    state.session.stepIndex++;
    // CORRECTION P3-C : Reset propre pour l'étape suivante sans casser l'état global
    if(task.duration>0){
      state.session.remainingTime = task.duration * 60 * 1000;
      state.session.activeTimeAccumulated = 0;
      state.session.lastActiveAt = Date.now();
    }
    saveSession();renderDevice();
    if(state.settings.vibration&&navigator.vibrate)navigator.vibrate(30);
    startBtn.classList.add('glow');setTimeout(()=>startBtn.classList.remove('glow'),500);
    if(task.duration>0) startTimer();
  } else {
    showEndScreen();
  }
}

function pauseSession(){
  if(!state.session.isActive)return;
  state.session.isPaused=true;
  // CORRECTION P3-B : Ajouter le temps travaillé jusqu'à la pause
  state.session.activeTimeAccumulated += (Date.now() - state.session.lastActiveAt);
  stopTimer();saveSession();renderDevice();toast('Session en pause');
}

function resumeSession(){
  if(!state.session.isPaused)return;
  state.session.isPaused=false;
  state.session.lastActiveAt = Date.now(); // Repart de maintenant
  saveSession();renderDevice();
  if(state.session.remainingTime>0) startTimer();
  toast('Session reprise');
}

function quitSession(){
  stopTimer();releaseWakeLock();
  const task = getCurrentTask();
  if(task && state.session.isActive) {
    // CORRECTION P3-B : Durée réelle = temps accumulé + temps depuis la dernière reprise
    const finalActiveTime = state.session.activeTimeAccumulated + (Date.now() - state.session.lastActiveAt);
    state.journey.sessions.push({
      id:'s_'+Date.now(),
      taskName:task.name,
      taskId:task.id,
      duration:Math.max(1, Math.floor(finalActiveTime / 60000)), // en minutes réelles
      plannedDuration:task.duration,
      status:'abandoned',
      completedAt:Date.now(),
      taskCount:1,
      stepIndex:state.session.stepIndex
    });
    saveJourney();
  }
  state.session.isActive=false;
  state.session.isPaused=false;
  state.session.remainingTime=0;
  state.session.activeTimeAccumulated=0;
  state.session.lastActiveAt=null;
  state.session.startedAt=null;
  saveSession();renderDevice();toast('Session quittée');
}

// CORRECTION P3-B : Chronomètre basé sur le delta de temps réel
function startTimer(){
  stopTimer();
  updateTimerFromEndTime();
  timerInterval=setInterval(()=>{
    if(state.session.isPaused)return;
    const now = Date.now();
    const elapsed = now - state.session.lastActiveAt;
    state.session.remainingTime = Math.max(0, state.session.remainingTime - elapsed);
    state.session.activeTimeAccumulated += elapsed;
    state.session.lastActiveAt = now;
    
    updateTimerFromEndTime();
    
    if(state.session.remainingTime<=0){
      stopTimer();
      onTimerEnd();
    }
  }, 200);
}

function updateTimerFromEndTime(){
  const r = state.session.remainingTime;
  const t = state.session.remainingTime + state.session.activeTimeAccumulated;
  const p = t > 0 ? r / t : 0;
  progressFill.style.strokeDashoffset = CIRCUMFERENCE * (1 - p);
  const d = formatTimerDisplay(Math.floor(r / 1000));
  if(d.hour!==null){timerMin.textContent=d.hour+':'+d.min;timerSec.textContent=d.sec;}
  else{timerMin.textContent=d.min;timerSec.textContent=d.sec;}
}

function onTimerEnd(){
  const task=getCurrentTask();
  if(task && state.session.stepIndex < task.steps.length - 1){
    state.session.stepIndex++;
    const d = task.duration > 0 ? task.duration * 60 * 1000 : 0;
    state.session.remainingTime = d;
    state.session.activeTimeAccumulated = 0;
    state.session.lastActiveAt = Date.now();
    saveSession();renderDevice();
    playAlert();
    if(state.settings.vibration&&navigator.vibrate)navigator.vibrate([120,80,120]);
    toast('Étape suivante');
    if(d>0) startTimer();
  } else {
    showEndScreen();
  }
}

function completeTask(){
  const task=getCurrentTask();if(!task)return;
  task.done=true;
  
  // CORRECTION P3-B : Calcul final du temps réel travaillé
  const finalActiveTime = state.session.activeTimeAccumulated + (Date.now() - state.session.lastActiveAt);
  const durationInMin = Math.max(1, Math.floor(finalActiveTime / 60000));
  
  state.journey.sessions.push({
    id:'s_'+Date.now(),
    taskName:task.name,
    taskId:task.id,
    duration:durationInMin,
    plannedDuration:task.duration,
    status:'completed',
    completedAt:Date.now(),
    taskCount:1,
    stepIndex:state.session.stepIndex
  });
  
  updateQuestProgress({type:'taskCompleted',duration:durationInMin,taskCount:1});
  
  stopTimer();releaseWakeLock();
  state.session.isActive=false;
  state.session.taskId=null;state.session.stepIndex=0;
  state.session.remainingTime=0;state.session.activeTimeAccumulated=0;
  state.session.lastActiveAt=null;state.session.startedAt=null;
  saveTasks();saveSession();saveJourney();
  renderTasks();renderDevice();toast('Tâche terminée');progressFill.classList.add('complete');
  if(document.getElementById('view-quests').classList.contains('active'))renderQuests();
}

// ... (Inclure ici les fonctions renderDevice, loadTask, getCurrentTask, bindSegmented, etc. de la version précédente) ...

// CORRECTION P3-D : Sauvegarde robuste à la fermeture
window.addEventListener('beforeunload',()=>{saveSession();});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden') {
    saveSession();
  } else {
    // Reprise après retour dans l'onglet
    if(state.session.isActive && !state.session.isPaused && state.session.remainingTime > 0) {
      if(!timerInterval) {
        const t=getCurrentTask();
        if(t) startTimer();
      }
    }
  }
});
</script>
