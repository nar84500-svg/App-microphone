<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carnet Vocal — Réception Carte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0b0d;
      --surface: #131317;
      --surface-hover: #19191f;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text-main: #f4f3ef;
      --text-muted: #8e8c99;
      --accent: #e07a5f;
      --ok: #4ade80;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(circle at 50% 0%, rgba(224, 122, 95, 0.07), transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 36px 20px 72px;
      line-height: 1.65;
    }

    .container {
      max-width: 740px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 32px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 6px;
    }

    h1 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 42px;
      font-weight: 400;
      line-height: 1.05;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 8px var(--ok);
    }

    .refresh-btn {
      appearance: none;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      color: var(--text-main);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .refresh-btn:hover {
      border-color: var(--accent);
      background: var(--surface-hover);
    }

    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .note-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
    }

    .note-header {
      padding: 16px 26px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.015);
    }

    .note-date {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }

    .copy-btn {
      appearance: none;
      background: transparent;
      border: 1px solid var(--border-strong);
      color: var(--text-main);
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .copy-btn:hover {
      background: var(--surface-hover);
      border-color: var(--text-muted);
    }

    .note-body {
      padding: 26px;
    }

    .summary-text {
      font-size: 15px;
      color: var(--text-main);
      white-space: pre-wrap;
    }

    .transcript-section {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }

    .transcript-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .transcript-content {
      font-size: 13px;
      color: var(--text-muted);
      font-style: italic;
    }

    .empty-state {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 56px 24px;
      text-align: center;
    }

    .empty-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .empty-desc {
      font-size: 13px;
      color: var(--text-muted);
      max-width: 420px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <div class="eyebrow">Flux matériel ESP32</div>
        <h1>Notes Vocales</h1>
      </div>
      <div class="header-actions">
        <div class="status-badge">
          <span class="dot"></span>
          <span id="syncStatus">Synchronisation active</span>
        </div>
        <button class="refresh-btn" id="refreshBtn" type="button">Actualiser</button>
      </div>
    </header>

    <main class="notes-list" id="notesContainer">
      <div class="empty-state">
        <div class="empty-title">En attente de la carte</div>
        <div class="empty-desc">
          Dès que tu appuies sur le bouton de ta carte électronique pour enregistrer une note, sa synthèse apparaît ici automatiquement.
        </div>
      </div>
    </main>
  </div>

  <script>
    const WORKER_URL = "https://note-vocale.nar84500.workers.dev";
    const notesContainer = document.getElementById("notesContainer");
    const syncStatus = document.getElementById("syncStatus");
    const refreshBtn = document.getElementById("refreshBtn");

    let lastRenderedHash = "";

    function escapeHtml(str) {
      return (str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    async function fetchNotes() {
      try {
        const res = await fetch(WORKER_URL, { method: "GET" });
        const data = await res.json();
        const notes = data.notes || [];

        const currentHash = JSON.stringify(notes.map((n) => n.id));
        if (currentHash === lastRenderedHash && notes.length > 0) return;
        lastRenderedHash = currentHash;

        if (notes.length === 0) {
          notesContainer.innerHTML = `
            <div class="empty-state">
              <div class="empty-title">En attente de la carte</div>
              <div class="empty-desc">
                Dès que tu appuies sur le bouton de ta carte électronique pour enregistrer une note, sa synthèse apparaît ici automatiquement.
              </div>
            </div>
          `;
          return;
        }

        notesContainer.innerHTML = notes
          .map(
            (note, index) => `
            <article class="note-card">
              <div class="note-header">
                <span class="note-date">${escapeHtml(note.date || "Note reçue")}</span>
                <button class="copy-btn" type="button" onclick="copyNote(${index})">Copier</button>
              </div>
              <div class="note-body">
                <div class="summary-text">${escapeHtml(note.summary)}</div>
                <div class="transcript-section">
                  <div class="transcript-label">Transcription brute</div>
                  <div class="transcript-content">${escapeHtml(note.transcript)}</div>
                </div>
              </div>
            </article>
          `
          )
          .join("");

        window._loadedNotes = notes;
        syncStatus.textContent = "Synchronisation active";
      } catch (err) {
        syncStatus.textContent = "Hors ligne";
      }
    }

    window.copyNote = async function (index) {
      const note = window._loadedNotes?.[index];
      if (!note) return;
      const text = `${note.summary}\n\nTranscription :\n${note.transcript}`;
      await navigator.clipboard.writeText(text);
    };

    refreshBtn.addEventListener("click", fetchNotes);
    fetchNotes();
    setInterval(fetchNotes, 5000);
  </script>
</body>
</html>
