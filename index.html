<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archive Vocale — Console Matérielle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --sidebar: #0f0f13;
      --surface: #141419;
      --surface-hover: #1b1b22;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text-main: #f4f3ef;
      --text-muted: #8b8996;
      --accent: #d97757;
      --accent-soft: rgba(217, 119, 87, 0.14);
      --ok: #4ade80;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      line-height: 1.6;
    }

    /* Barre latérale historique */
    .sidebar {
      width: 320px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: sticky;
      top: 0;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 24px 20px 16px;
      border-bottom: 1px solid var(--border);
    }

    .brand-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .brand-title {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 30px;
      font-weight: 400;
      line-height: 1.1;
      margin-bottom: 16px;
    }

    .search-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      padding: 9px 12px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .history-meta {
      padding: 12px 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .history-item {
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .history-item:hover {
      background: var(--surface);
    }

    .history-item.active {
      background: var(--surface-hover);
      border-color: var(--border-strong);
    }

    .history-item-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item-date {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Zone principale de lecture */
    .main-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      padding: 16px 32px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      background: rgba(9, 9, 11, 0.8);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 8px var(--ok);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      appearance: none;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      color: var(--text-main);
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: var(--surface-hover);
      border-color: var(--text-muted);
    }

    .btn-accent {
      background: var(--accent-soft);
      border-color: rgba(217, 119, 87, 0.35);
      color: var(--accent);
    }

    .btn-accent:hover {
      background: rgba(217, 119, 87, 0.22);
    }

    .btn-danger:hover {
      border-color: rgba(248, 113, 113, 0.45);
      color: var(--danger);
    }

    .document-container {
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 32px 80px;
    }

    .doc-meta {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .doc-title-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid transparent;
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 38px;
      font-weight: 400;
      color: var(--text-main);
      line-height: 1.15;
      padding-bottom: 8px;
      margin-bottom: 28px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .doc-title-input:hover,
    .doc-title-input:focus {
      border-bottom-color: var(--border-strong);
    }

    .card-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 24px;
    }

    .block-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .summary-body {
      font-size: 15px;
      color: var(--text-main);
      white-space: pre-wrap;
      line-height: 1.75;
    }

    .transcript-body {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.7;
    }

    .empty-workspace {
      text-align: center;
      padding: 90px 24px;
      max-width: 440px;
      margin: 0 auto;
    }

    .empty-workspace h2 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 32px;
      font-weight: 400;
      margin-bottom: 10px;
    }

    .empty-workspace p {
      font-size: 14px;
      color: var(--text-muted);
    }

    @media (max-width: 820px) {
      body {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        height: auto;
        max-height: 300px;
        position: static;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      .topbar {
        padding: 14px 20px;
      }
      .document-container {
        padding: 28px 20px 60px;
      }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand-tag">Liaison ESP32</div>
      <div class="brand-title">Carnet Vocal</div>
      <input type="text" class="search-input" id="searchInput" placeholder="Rechercher dans l'historique..." />
    </div>
    <div class="history-meta">
      <span>Historique</span>
      <span id="noteCount">0 note</span>
    </div>
    <div class="history-list" id="historyList"></div>
  </aside>

  <div class="main-view">
    <header class="topbar">
      <div class="status-group">
        <span class="status-dot"></span>
        <span id="syncStatus">Réception automatique active</span>
      </div>
      <div class="topbar-actions" id="docActions" style="display:none;">
        <button class="btn btn-accent" id="copyBtn" type="button">Copier la synthèse</button>
        <button class="btn" id="downloadBtn" type="button">Exporter (.txt)</button>
        <button class="btn btn-danger" id="deleteBtn" type="button">Supprimer</button>
      </div>
    </header>

    <main class="document-container" id="workspace">
      <div class="empty-workspace">
        <h2>Aucune note sélectionnée</h2>
        <p>Enregistre un mémo depuis ta carte électronique : la fiche structurée apparaîtra automatiquement dans ton historique.</p>
      </div>
    </main>
  </div>

  <script>
    const WORKER_URL = "https://note-vocale.nar84500.workers.dev";

    const historyList = document.getElementById("historyList");
    const noteCount = document.getElementById("noteCount");
    const searchInput = document.getElementById("searchInput");
    const workspace = document.getElementById("workspace");
    const docActions = document.getElementById("docActions");
    const syncStatus = document.getElementById("syncStatus");

    const copyBtn = document.getElementById("copyBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const deleteBtn = document.getElementById("deleteBtn");

    let allNotes = [];
    let selectedId = null;

    function escapeHtml(str) {
      return (str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function renderSidebar() {
      const query = searchInput.value.trim().toLowerCase();
      const filtered = allNotes.filter(
        (n) =>
          (n.title || "").toLowerCase().includes(query) ||
          (n.summary || "").toLowerCase().includes(query) ||
          (n.transcript || "").toLowerCase().includes(query)
      );

      noteCount.textContent = `${filtered.length} ${filtered.length > 1 ? "notes" : "note"}`;

      if (filtered.length === 0) {
        historyList.innerHTML = `<div style="padding:16px;font-size:12px;color:var(--text-muted);">Aucun enregistrement trouvé.</div>`;
        return;
      }

      historyList.innerHTML = filtered
        .map(
          (note) => `
          <div class="history-item ${note.id === selectedId ? "active" : ""}" onclick="selectNote(${note.id})">
            <div class="history-item-title">${escapeHtml(note.title || "Note vocale")}</div>
            <div class="history-item-date">${escapeHtml(note.date || "")}</div>
          </div>
        `
        )
        .join("");
    }

    function renderWorkspace() {
      const note = allNotes.find((n) => n.id === selectedId);
      if (!note) {
        docActions.style.display = "none";
        workspace.innerHTML = `
          <div class="empty-workspace">
            <h2>En attente de la carte</h2>
            <p>Dès qu'un enregistrement est envoyé depuis ton microcontrôleur, il s'ajoute ici avec sa synthèse et sa transcription.</p>
          </div>
        `;
        return;
      }

      docActions.style.display = "flex";
      workspace.innerHTML = `
        <div class="doc-meta">Reçu le ${escapeHtml(note.date || "")}</div>
        <input type="text" class="doc-title-input" id="titleEditor" value="${escapeHtml(note.title || "Note vocale")}" />
        <div class="card-block">
          <div class="block-label">Synthèse structurée</div>
          <div class="summary-body">${escapeHtml(note.summary)}</div>
        </div>
        <div class="card-block">
          <div class="block-label">Transcription intégrale</div>
          <div class="transcript-body">${escapeHtml(note.transcript)}</div>
        </div>
      `;

      const titleEditor = document.getElementById("titleEditor");
      titleEditor.addEventListener("change", async () => {
        const newTitle = titleEditor.value.trim() || "Note vocale";
        note.title = newTitle;
        renderSidebar();
        await fetch(WORKER_URL, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: note.id, title: newTitle }),
        });
      });
    }

    window.selectNote = function (id) {
      selectedId = id;
      renderSidebar();
      renderWorkspace();
    };

    async function syncNotes() {
      try {
        const res = await fetch(WORKER_URL, { method: "GET" });
        const data = await res.json();
        const incoming = data.notes || [];

        const prevFirstId = allNotes[0]?.id;
        const newFirstId = incoming[0]?.id;
        const changed = JSON.stringify(incoming.map((n) => n.id + n.title)) !== JSON.stringify(allNotes.map((n) => n.id + n.title));

        if (changed) {
          allNotes = incoming;
          if (!selectedId || (newFirstId && newFirstId !== prevFirstId)) {
            selectedId = allNotes[0]?.id || null;
          }
          renderSidebar();
          renderWorkspace();
        }
        syncStatus.textContent = "Réception automatique active";
      } catch (err) {
        syncStatus.textContent = "Connexion interrompue";
      }
    }

    copyBtn.addEventListener("click", async () => {
      const note = allNotes.find((n) => n.id === selectedId);
      if (!note) return;
      const content = `${note.title}\n${note.date}\n\n${note.summary}\n\nTranscription :\n${note.transcript}`;
      await navigator.clipboard.writeText(content);
      const prev = copyBtn.textContent;
      copyBtn.textContent = "Copié";
      setTimeout(() => (copyBtn.textContent = prev), 1600);
    });

    downloadBtn.addEventListener("click", () => {
      const note = allNotes.find((n) => n.id === selectedId);
      if (!note) return;
      const content = `${note.title}\nDate : ${note.date}\n\n${note.summary}\n\n---\nTRANSCRIPTION :\n${note.transcript}`;
      const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${(note.title || "note").toLowerCase().replace(/[^a-z0-9]+/gi, "-")}.txt`;
      a.click();
      URL.revokeObjectURL(url);
    });

    deleteBtn.addEventListener("click", async () => {
      if (!selectedId) return;
      const idToDelete = selectedId;
      allNotes = allNotes.filter((n) => n.id !== idToDelete);
      selectedId = allNotes[0]?.id || null;
      renderSidebar();
      renderWorkspace();
      await fetch(`${WORKER_URL}?id=${idToDelete}`, { method: "DELETE" });
    });

    searchInput.addEventListener("input", renderSidebar);

    syncNotes();
    setInterval(syncNotes, 5000);
  </script>
</body>
</html>
