<!DOCTYPE html>
<html lang="fr" data-theme="clair">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FF6B0F">
<title>Clic — Commence simplement</title>
<style>
@font-face { font-family: 'Nunito'; font-style: normal; font-weight: 400; font-display: swap; src: local('Nunito'), local('Nunito-Regular'); }
@font-face { font-family: 'Nunito'; font-style: normal; font-weight: 600; font-display: swap; src: local('Nunito-SemiBold'); }
@font-face { font-family: 'Nunito'; font-style: normal; font-weight: 700; font-display: swap; src: local('Nunito-Bold'); }
@font-face { font-family: 'Nunito'; font-style: normal; font-weight: 800; font-display: swap; src: local('Nunito-ExtraBold'); }
@font-face { font-family: 'Caveat'; font-style: normal; font-weight: 700; font-display: swap; src: local('Caveat-Bold'); }

:root, [data-theme="clair"] {
  --bg-top: #FFF3EF; --bg-bottom: #FFE6EA; --blob-1: #FFD3C2; --blob-2: #FFC9D6;
  --surface: rgba(255,255,255,0.78); --surface-border: rgba(255,255,255,0.9); --surface-solid: #FFFFFF;
  --text: #3A1A12; --text-secondary: #7A5446; --text-on-accent: #FFFFFF;
  --accent: #FF6B0F; --accent-gradient-start: #FF7A1A; --accent-gradient-end: #F25A00;
  --accent-dark: #B8420A; --accent-halo: rgba(255,107,15,0.25);
  --line: rgba(58,26,18,0.08); --shadow: rgba(180,90,60,0.10);
  --cat-orange: #FF6B0F; --cat-orange-text: #B8420A;
  --cat-amber: #F2A300; --cat-amber-text: #8A5A00;
  --cat-peach: #F48A57; --cat-peach-text: #A8501F;
  --cat-magenta: #C43AA5; --cat-magenta-text: #9A2A82;
  --nav-bg: rgba(255,255,255,0.92); --nav-active-bg: #FFE8DC; --nav-active-text: #B8420A; --nav-inactive: #7A5446;
  --success: #3FA24A; --success-bg: #E3F5E1;
}

[data-theme="nuit"] {
  --bg-top: #17120F; --bg-bottom: #1F1612; --blob-1: #2A1F1A; --blob-2: #2A1A20;
  --surface: rgba(36,28,23,0.85); --surface-border: rgba(255,255,255,0.10); --surface-solid: #241C17;
  --text: #F6EBDD; --text-secondary: #C9B8A6;
  --accent: #FF8A3D; --accent-gradient-start: #FF9A55; --accent-gradient-end: #E06B20;
  --accent-dark: #CC6A20; --accent-halo: rgba(255,138,61,0.30);
  --line: rgba(255,255,255,0.10); --shadow: rgba(0,0,0,0.30);
  --cat-orange: #FF8A3D; --cat-orange-text: #FFB080;
  --cat-amber: #FFC04D; --cat-amber-text: #FFD880;
  --cat-peach: #FF9A6B; --cat-peach-text: #FFC0A0;
  --cat-magenta: #D860B8; --cat-magenta-text: #E890D0;
  --nav-bg: rgba(36,28,23,0.95); --nav-active-bg: rgba(255,138,61,0.20); --nav-active-text: #FF8A3D; --nav-inactive: #C9B8A6;
}

[data-theme="galaxie"] {
  --bg-top: #14142B; --bg-bottom: #1F1B3D; --blob-1: #2A2550; --blob-2: #352050;
  --surface: rgba(38,38,74,0.85); --surface-border: rgba(255,255,255,0.12); --surface-solid: #26264A;
  --text: #F3EEFF; --text-secondary: #C4BCE0;
  --accent: #FF8F66; --accent-gradient-start: #FFA080; --accent-gradient-end: #E07040;
  --accent-dark: #CC6030; --accent-halo: rgba(255,143,102,0.30);
  --line: rgba(255,255,255,0.10); --shadow: rgba(0,0,0,0.35);
  --cat-orange: #FF8F66; --cat-orange-text: #FFB899;
  --cat-amber: #FFC066; --cat-amber-text: #FFD899;
  --cat-peach: #FFA080; --cat-peach-text: #FFC8B0;
  --cat-magenta: #C870D0; --cat-magenta-text: #DCA0E0;
  --nav-bg: rgba(38,38,74,0.95); --nav-active-bg: rgba(255,143,102,0.20); --nav-active-text: #FF8F66; --nav-inactive: #C4BCE0;
}

[data-theme="chaleureux"] {
  --bg-top: #F7EBD8; --bg-bottom: #F0DFC4; --blob-1: #E8D4B0; --blob-2: #E0C8A0;
  --surface: rgba(255,249,238,0.85); --surface-border: rgba(255,255,255,0.7); --surface-solid: #FFF9EE;
  --text: #3A2A1B; --text-secondary: #6F5A44;
  --accent: #E0641E; --accent-gradient-start: #E87830; --accent-gradient-end: #C85010;
  --accent-dark: #B8470F; --accent-halo: rgba(224,100,30,0.25);
  --line: rgba(58,42,27,0.10); --shadow: rgba(120,80,40,0.12);
  --cat-orange: #E0641E; --cat-orange-text: #B8470F;
  --cat-amber: #D49020; --cat-amber-text: #A06810;
  --cat-peach: #D87840; --cat-peach-text: #A85020;
  --cat-magenta: #B04090; --cat-magenta-text: #802060;
  --nav-bg: rgba(255,249,238,0.95); --nav-active-bg: #F5DCC0; --nav-active-text: #B8470F; --nav-inactive: #6F5A44;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; height: 100dvh; overflow: hidden; }
body {
  font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-weight: 500; color: var(--text);
  background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
  min-height: 100dvh; overflow-x: hidden; overflow-y: auto;
  -webkit-font-smoothing: antialiased;
}

.bg-blob { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.40; pointer-events: none; z-index: 0; }
.bg-blob-1 { width: 320px; height: 320px; background: var(--blob-1); top: -80px; right: -60px; }
.bg-blob-2 { width: 280px; height: 280px; background: var(--blob-2); bottom: 100px; left: -80px; }

.screen { position: relative; z-index: 1; min-height: 100dvh; padding: 0 20px; padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px)); padding-top: 20px; overflow-y: auto; }
.screen-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.screen-title { font-size: 32px; font-weight: 800; color: var(--text); }

.btn-primary {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: linear-gradient(135deg, var(--accent-gradient-start), var(--accent-gradient-end));
  color: var(--text-on-accent); border: none; border-radius: 16px; padding: 14px 28px;
  font-family: 'Nunito', system-ui, sans-serif; font-size: 16px; font-weight: 700;
  cursor: pointer; transition: transform 150ms ease, box-shadow 150ms ease;
  min-height: 48px; min-width: 44px;
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 16px var(--accent-halo); }
.btn-primary:active { transform: translateY(0); }

.btn-secondary {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--surface-solid); color: var(--text); border: 1px solid var(--line);
  border-radius: 16px; padding: 14px 28px;
  font-family: 'Nunito', system-ui, sans-serif; font-size: 16px; font-weight: 700;
  cursor: pointer; transition: transform 150ms ease, background 150ms ease;
  min-height: 48px; min-width: 44px;
}
.btn-secondary:hover { background: var(--nav-active-bg); }

.btn-round {
  display: inline-flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-gradient-start), var(--accent-gradient-end));
  color: #FFFFFF; border: none; cursor: pointer; transition: transform 150ms ease; flex-shrink: 0;
}
.btn-round:hover { transform: scale(1.05); }
.btn-round:active { transform: scale(0.95); }

.btn-back {
  display: inline-flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--surface); border: 1px solid var(--surface-border);
  cursor: pointer; transition: background 150ms ease; flex-shrink: 0;
}
.btn-back:hover { background: var(--nav-active-bg); }

.card {
  background: var(--surface); border: 1px solid var(--surface-border);
  border-radius: 24px; box-shadow: 0 8px 24px var(--shadow);
  padding: 20px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}

.progress-bar { width: 100%; height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
.progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent-gradient-start), var(--accent-gradient-end)); border-radius: 5px; transition: width 300ms ease; }

.bottom-nav {
  position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
  width: calc(100% - 24px); max-width: 420px; height: 72px;
  background: var(--nav-bg); border: 1px solid var(--surface-border);
  border-radius: 36px; box-shadow: 0 8px 32px var(--shadow);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  display: flex; align-items: center; justify-content: space-around;
  padding: 0 8px; padding-bottom: env(safe-area-inset-bottom, 0); z-index: 100;
}

.nav-item {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px; padding: 8px 12px; border-radius: 20px; cursor: pointer;
  transition: all 150ms ease; min-width: 44px; min-height: 44px;
  background: none; border: none; font-family: 'Nunito', system-ui, sans-serif;
}
.nav-item:hover { background: var(--nav-active-bg); }
.nav-item.active { background: var(--nav-active-bg); }
.nav-item.active .nav-icon { color: var(--nav-active-text); }
.nav-item.active .nav-label { color: var(--nav-active-text); }
.nav-icon { width: 24px; height: 24px; color: var(--nav-inactive); transition: color 150ms ease; }
.nav-label { font-size: 11px; font-weight: 700; color: var(--nav-inactive); transition: color 150ms ease; line-height: 1; }

.nav-center-btn {
  width: 60px; height: 60px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-gradient-start), var(--accent-gradient-end));
  border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
  margin-top: -14px; box-shadow: 0 4px 16px var(--accent-halo);
  transition: transform 150ms ease, box-shadow 150ms ease; position: relative; z-index: 2;
}
.nav-center-btn:hover { transform: scale(1.05); box-shadow: 0 6px 24px var(--accent-halo); }
.nav-center-btn:active { transform: scale(0.95); }
.nav-center-btn svg { width: 28px; height: 28px; color: #FFFFFF; }

.home-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 8px; padding-top: calc(16px + env(safe-area-inset-top, 0)); }
.home-logo { display: flex; align-items: center; gap: 12px; }
.home-logo-icon { width: 48px; height: 48px; background: var(--surface-solid); border-radius: 14px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px var(--shadow); flex-shrink: 0; }
.home-logo-text h1 { font-size: 26px; font-weight: 800; color: var(--text); line-height: 1.1; }
.home-logo-text p { font-size: 14px; font-weight: 500; color: var(--text-secondary); line-height: 1.2; }

.btn-icon {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--surface); border: 1px solid var(--surface-border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: background 150ms ease; position: relative;
}
.btn-icon:hover { background: var(--nav-active-bg); }

.greeting { margin-bottom: 20px; }
.greeting-title { font-size: 28px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
.greeting-subtitle { font-size: 16px; font-weight: 500; color: var(--text-secondary); }

.search-bar {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface-solid); border: 1px solid var(--line);
  border-radius: 16px; padding: 12px 18px; margin-bottom: 20px;
}
.search-bar svg { width: 20px; height: 20px; color: var(--text-secondary); flex-shrink: 0; }
.search-bar input { flex: 1; border: none; background: none; font-family: 'Nunito', system-ui, sans-serif; font-size: 15px; font-weight: 500; color: var(--text); outline: none; }
.search-bar input::placeholder { color: var(--text-secondary); opacity: 0.6; }

.focus-card {
  background: linear-gradient(135deg, rgba(255,200,180,0.3), rgba(255,180,200,0.2));
  border: 1px solid var(--surface-border); border-radius: 24px; padding: 20px; margin-bottom: 20px;
}
.focus-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.focus-card-title { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; color: var(--text); }
.focus-card-stats { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 12px; }
.focus-card-progress { display: flex; align-items: center; gap: 12px; }
.focus-card-progress .progress-bar { flex: 1; }
.focus-card-percent { font-size: 20px; font-weight: 800; color: var(--text); min-width: 50px; text-align: right; }

.section { margin-bottom: 28px; }
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.section-title { font-size: 20px; font-weight: 800; color: var(--text); }
.section-link { font-size: 14px; font-weight: 700; color: var(--accent); background: none; border: none; cursor: pointer; font-family: 'Nunito', system-ui, sans-serif; }

.resume-card {
  background: linear-gradient(135deg, rgba(220,180,255,0.2), rgba(255,200,180,0.3));
  border: 1px solid var(--surface-border); border-radius: 24px; padding: 20px;
  display: flex; align-items: center; gap: 16px; cursor: pointer;
  transition: transform 150ms ease; margin-bottom: 20px;
}
.resume-card:hover { transform: translateY(-2px); }
.resume-card-content { flex: 1; min-width: 0; }
.resume-card-title { font-size: 18px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
.resume-card-status { font-size: 14px; font-weight: 500; color: var(--text-secondary); margin-bottom: 4px; }
.resume-card-time { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--text); }
.resume-card-btn {
  display: flex; align-items: center; gap: 6px; padding: 10px 18px;
  background: var(--surface-solid); border: 1px solid var(--line); border-radius: 14px;
  font-family: 'Nunito', system-ui, sans-serif; font-size: 14px; font-weight: 700;
  color: var(--accent); cursor: pointer; transition: background 150ms ease; flex-shrink: 0;
}
.resume-card-btn:hover { background: var(--nav-active-bg); }

.quick-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.quick-action {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 16px 8px; background: var(--surface); border: 1px solid var(--surface-border);
  border-radius: 20px; cursor: pointer; transition: transform 150ms ease, background 150ms ease;
  text-align: center; min-height: 44px;
}
.quick-action:hover { transform: translateY(-2px); background: var(--nav-active-bg); }
.quick-action-icon { width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; }
.quick-action-label { font-size: 12px; font-weight: 700; color: var(--text); line-height: 1.2; }

.task-card {
  background: var(--surface); border: 1px solid var(--surface-border);
  border-radius: 24px; padding: 20px; display: flex; align-items: center; gap: 16px;
  cursor: pointer; transition: transform 150ms ease, box-shadow 150ms ease;
  margin-bottom: 12px; position: relative; overflow: hidden;
}
.task-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px var(--shadow); }
.task-card-bar { position: absolute; left: 0; top: 16px; bottom: 16px; width: 5px; border-radius: 3px; }
.task-card-bar.orange { background: var(--cat-orange); }
.task-card-bar.amber { background: var(--cat-amber); }
.task-card-bar.peach { background: var(--cat-peach); }
.task-card-bar.magenta { background: var(--cat-magenta); }
.task-card-content { flex: 1; padding-left: 12px; min-width: 0; }
.task-card-category { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
.task-card-category.orange { color: var(--cat-orange-text); }
.task-card-category.amber { color: var(--cat-amber-text); }
.task-card-category.peach { color: var(--cat-peach-text); }
.task-card-category.magenta { color: var(--cat-magenta-text); }
.task-card-title { font-size: 18px; font-weight: 800; color: var(--text); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task-card-subtitle { font-size: 14px; font-weight: 500; color: var(--text-secondary); }

.session-screen {
  position: fixed; inset: 0; background: linear-gradient(180deg, #1A110D 0%, #0D0806 100%);
  z-index: 2000; display: flex; flex-direction: column; padding: 20px;
  padding-top: calc(20px + env(safe-area-inset-top, 0));
  padding-bottom: calc(20px + env(safe-area-inset-bottom, 0));
  overflow-y: auto;
}
.session-top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
.session-top-btn {
  width: 44px; height: 44px; border-radius: 50%;
  background: rgba(255,255,255,0.1); border: none;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: background 150ms ease;
}
.session-top-btn:hover { background: rgba(255,255,255,0.2); }
.session-top-btn svg { width: 22px; height: 22px; color: #FFFFFF; }
.session-center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
.session-task-name { font-family: 'Caveat', 'Comic Sans MS', cursive; font-size: 28px; font-weight: 700; color: #FFFFFF; text-align: center; }
.session-step-info { font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.7); text-align: center; }
.session-step-text { font-size: 18px; font-weight: 500; color: rgba(255,255,255,0.9); text-align: center; max-width: 300px; line-height: 1.4; }
.session-timer { font-size: 48px; font-weight: 800; color: #FFFFFF; font-variant-numeric: tabular-nums; letter-spacing: 2px; }

.start-button-wrapper { position: relative; width: 160px; height: 160px; display: flex; align-items: center; justify-content: center; }
.start-button-ring { position: absolute; inset: 0; border-radius: 50%; }
.start-button-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.start-button-ring circle { fill: none; stroke-width: 6; }
.start-button-ring .ring-bg { stroke: rgba(255,255,255,0.1); }
.start-button-ring .ring-progress { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 300ms ease; }
.start-button {
  width: 110px; height: 110px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-gradient-start), var(--accent-gradient-end));
  border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-family: 'Caveat', 'Comic Sans MS', cursive; font-size: 30px; font-weight: 700; color: #FFFFFF;
  box-shadow: 0 8px 32px var(--accent-halo); animation: breathe 3s ease-in-out infinite;
  transition: transform 150ms ease; z-index: 1;
}
.start-button:hover { transform: scale(1.05); }
.start-button:active { transform: scale(0.95); animation: none; }
@keyframes breathe { 0%, 100% { box-shadow: 0 8px 32px var(--accent-halo); } 50% { box-shadow: 0 8px 48px rgba(255,107,15,0.4); } }
@media (prefers-reduced-motion: reduce) { .start-button { animation: none; } }

.profile-header { text-align: center; padding: 20px 0 28px; }
.profile-avatar-bg { width: 140px; height: 140px; border-radius: 50%; background: linear-gradient(135deg, rgba(255,200,180,0.4), rgba(255,180,220,0.3)); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
.profile-name { font-size: 28px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
.profile-motto { font-size: 16px; font-weight: 500; color: var(--text-secondary); }

.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
.stat-card { background: var(--surface); border: 1px solid var(--surface-border); border-radius: 20px; padding: 16px 12px; text-align: center; }
.stat-card-value { font-size: 24px; font-weight: 800; color: var(--text); line-height: 1.1; }
.stat-card-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-top: 4px; line-height: 1.2; }

.settings-list { background: var(--surface); border: 1px solid var(--surface-border); border-radius: 20px; overflow: hidden; margin-bottom: 16px; }
.settings-row { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background 150ms ease; min-height: 44px; }
.settings-row:last-child { border-bottom: none; }
.settings-row:hover { background: var(--nav-active-bg); }
.settings-row-label { font-size: 16px; font-weight: 600; color: var(--text); }

.avatar-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
.avatar-option {
  background: var(--surface); border: 2px solid transparent; border-radius: 20px;
  padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px;
  cursor: pointer; transition: all 150ms ease; position: relative;
}
.avatar-option:hover { background: var(--nav-active-bg); }
.avatar-option.selected { border-color: var(--accent); background: var(--nav-active-bg); }
.avatar-option svg { width: 64px; height: 64px; }
.avatar-option-name { font-size: 13px; font-weight: 700; color: var(--text); text-align: center; }

.badges-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.badge-card { background: var(--surface); border: 1px solid var(--surface-border); border-radius: 20px; padding: 16px; text-align: center; transition: transform 150ms ease; }
.badge-card:hover { transform: translateY(-2px); }
.badge-card.locked { opacity: 0.5; filter: grayscale(100%); }
.badge-card svg { width: 80px; height: 80px; margin: 0 auto 10px; }
.badge-card-name { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.badge-card-condition { font-size: 11px; font-weight: 500; color: var(--text-secondary); line-height: 1.3; }

.tutorial-screen {
  position: fixed; inset: 0; background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
  z-index: 3000; display: flex; flex-direction: column; padding: 20px;
  padding-top: calc(20px + env(safe-area-inset-top, 0)); overflow-y: auto;
}
.tutorial-progress { width: 100%; height: 6px; background: var(--line); border-radius: 3px; margin-bottom: 32px; overflow: hidden; }
.tutorial-progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 300ms ease; }
.tutorial-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px 0; }
.tutorial-title { font-size: 28px; font-weight: 800; color: var(--text); margin-bottom: 16px; line-height: 1.2; }
.tutorial-text { font-size: 16px; font-weight: 500; color: var(--text-secondary); line-height: 1.6; max-width: 320px; margin-bottom: 32px; }
.tutorial-actions { display: flex; gap: 12px; width: 100%; max-width: 320px; }
.tutorial-actions .btn-secondary { flex: 1; }
.tutorial-actions .btn-primary { flex: 2; }

.bloque-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 20px; }
.bloque-card {
  background: var(--surface); border: 1px solid var(--surface-border);
  border-radius: 20px; padding: 20px; display: flex; align-items: center; gap: 16px;
  cursor: pointer; transition: transform 150ms ease, background 150ms ease;
}
.bloque-card:hover { transform: translateY(-2px); background: var(--nav-active-bg); }
.bloque-card-icon { width: 52px; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.bloque-card-title { font-size: 16px; font-weight: 700; color: var(--text); }

.toast-container {
  position: fixed; bottom: calc(90px + 16px); left: 50%; transform: translateX(-50%);
  z-index: 9999; display: flex; flex-direction: column; gap: 8px;
  pointer-events: none; padding: 0 16px; width: calc(100% - 32px); max-width: 400px;
}
.toast {
  background: var(--surface-solid); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 18px; box-shadow: 0 8px 24px var(--shadow);
  font-size: 14px; font-weight: 600; color: var(--text);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  pointer-events: auto; animation: toastIn 250ms ease;
}
@keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

@media (min-width: 768px) {
  .screen { max-width: 600px; margin: 0 auto; }
  .bottom-nav { max-width: 500px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }

  },

    this.data.points += amount;
    this.data.level = 1 + Math.floor(this.data.points / 100);
    Store.save();
  },
  recalculatePoints: function() {
    var pts = 0;
    this.data.tasks.forEach(function(task) {
      if (task.completed) pts += 5;
      if (task.steps) {
        task.steps.forEach(function(step) { if (step.completed) pts += 1; });
      }
    });
    this.data.sessions.forEach(function(session) {
      if (session.realDuration) pts += Math.floor(session.realDuration / 300);
    });
    this.data.points = pts;
    this.data.level = 1 + Math.floor(pts / 100);
  }
};

// Utilitaires
function formatDuration(seconds) {
  if (!seconds || seconds < 0) seconds = 0;
  seconds = Math.round(seconds);
  if (seconds < 60) return seconds + ' min';
  var h = Math.floor(seconds / 3600);
  var m = Math.floor((seconds % 3600) / 60);
  if (h === 0) return m + ' min';
  if (m === 0) return h + ' h';
  return h + ' h ' + m + ' min';
}

function formatTimer(seconds) {
  if (!seconds || seconds < 0) seconds = 0;
  seconds = Math.round(seconds);
  var h = Math.floor(seconds / 3600);
  var m = Math.floor((seconds % 3600) / 60);
  var s = seconds % 60;
  if (h > 0) return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function getGreeting() {
  var h = new Date().getHours();
  if (h < 12) return 'Bonjour';
  if (h < 18) return 'Bon après-midi';
  return 'Bonsoir';
}

function showToast(message) {
  var container = document.getElementById('toast-container');
  if (!container) return;
  var toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(function() {
    if (toast.parentNode) toast.parentNode.removeChild(toast);
  }, 3000);
}

// Écran Session
var currentSession = null;
var timerInterval = null;
var timerRemaining = 0;
var timerTotal = 0;
var timerState = 'idle';

function startSession(task) {
  currentSession = {
    id: Store.generateId(),
    taskId: task.id,
    taskTitle: task.title,
    start: Date.now(),
    plannedDuration: task.duration || 1800,
    realDuration: 0,
    status: 'running',
    date: State.getTodayStr(),
    steps: task.steps || [{ text: 'Commencer', seconds: 300 }],
    currentStep: 0
  };
  timerTotal = currentSession.plannedDuration;
  timerRemaining = timerTotal;
  timerState = 'running';
  renderSessionScreen();
  startTimer();
}

function startTimer() {
  var startTime = Date.now();
  var initialRemaining = timerRemaining;
  timerInterval = setInterval(function() {
    var elapsed = Math.floor((Date.now() - startTime) / 1000);
    timerRemaining = Math.max(0, initialRemaining - elapsed);
    updateTimerDisplay();
    if (timerRemaining <= 0) {
      endSession();
    }
  }, 250);
}

function updateTimerDisplay() {
  var timerEl = document.getElementById('session-timer');
  if (timerEl) timerEl.textContent = formatTimer(timerRemaining);
  var ring = document.getElementById('ring-progress');
  if (ring) {
    var circumference = 2 * Math.PI * 70;
    var progress = timerTotal > 0 ? (timerRemaining / timerTotal) : 0;
    ring.style.strokeDasharray = circumference;
    ring.style.strokeDashoffset = circumference * (1 - progress);
  }
}

function renderSessionScreen() {
  var app = document.getElementById('app');
  var nav = document.getElementById('bottom-nav');
  nav.style.display = 'none';

  var task = currentSession;
  var step = task.steps[task.currentStep] || task.steps[0];
  var circumference = 2 * Math.PI * 70;

  app.innerHTML = '<div class="session-screen">' +
    '<div class="session-top-bar">' +
      '<button class="session-top-btn" id="btn-pause">' + Icons.pause + '</button>' +
      '<button class="session-top-btn" id="btn-bloque-session">' + Icons.bouee + '</button>' +
      '<button class="session-top-btn" id="btn-quit">' + Icons.croix + '</button>' +
    '</div>' +
    '<div class="session-center">' +
      '<div class="session-task-name">' + task.taskTitle + '</div>' +
      '<div class="session-step-info">Étape ' + (task.currentStep + 1) + ' / ' + task.steps.length + '</div>' +
      '<div class="session-step-text">' + (step ? step.text : 'Commencer') + '</div>' +
      '<div class="session-timer" id="session-timer">' + formatTimer(timerRemaining) + '</div>' +
      '<div class="start-button-wrapper">' +
        '<div class="start-button-ring">' +
          '<svg viewBox="0 0 160 160"><circle class="ring-bg" cx="80" cy="80" r="70"/><circle class="ring-progress" id="ring-progress" cx="80" cy="80" r="70" stroke-dasharray="' + circumference + '" stroke-dashoffset="0"/></svg>' +
        '</div>' +
        '<button class="start-button" id="btn-start">START</button>' +
      '</div>' +
    '</div>' +
  '</div>';

  document.getElementById('btn-pause').addEventListener('click', function() {
    if (timerState === 'running') {
      clearInterval(timerInterval);
      timerState = 'paused';
      document.getElementById('btn-pause').innerHTML = Icons.play;
    } else if (timerState === 'paused') {
      timerState = 'running';
      document.getElementById('btn-pause').innerHTML = Icons.pause;
      startTimer();
    }
  });
  document.getElementById('btn-quit').addEventListener('click', function() {
    if (confirm('Quitter la session ?')) {
      clearInterval(timerInterval);
      nav.style.display = 'flex';
      Router.navigate('accueil');
    }
  });
  document.getElementById('btn-bloque-session').addEventListener('click', function() { Router.navigate('bloque'); });
  document.getElementById('btn-start').addEventListener('click', function() {
    nextStep();
  });
}

function nextStep() {
  if (!currentSession) return;
  currentSession.currentStep++;
  if (currentSession.currentStep >= currentSession.steps.length) {
    endSession();
  } else {
    renderSessionScreen();
  }
}

function endSession() {
  clearInterval(timerInterval);
  if (currentSession) {
    currentSession.end = Date.now();
    currentSession.realDuration = Math.floor((currentSession.end - currentSession.start) / 1000);
    currentSession.status = 'completed';
    State.data.sessions.push(currentSession);
    State.addPoints(Math.floor(currentSession.realDuration / 300));
    State.recalculatePoints();
    Store.save();
  }
  var nav = document.getElementById('bottom-nav');
  nav.style.display = 'flex';
  showToast('Bien joué ! Tu as travaillé ' + formatDuration(currentSession ? currentSession.realDuration : 0));
  Router.navigate('accueil');
}

      '<select id="task-list" style="width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;font-family:Nunito,sans-serif;font-size:16px;background:var(--surface-solid);color:var(--text);">' +
        lists.map(function(l) { return '<option value="' + l.id + '">' + l.name + '</option>'; }).join('') +
      '</select>' +
    '</div>' +
    '<div class="card" style="margin-bottom:16px;">' +
      '<label style="display:block;font-size:14px;font-weight:700;color:var(--text-secondary);margin-bottom:8px;">Durée</label>' +
      '<select id="task-duration" style="width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;font-family:Nunito,sans-serif;font-size:16px;background:var(--surface-solid);color:var(--text);">' +
        '<option value="300">5 min</option><option value="600">10 min</option><option value="900">15 min</option><option value="1800" selected>30 min</option><option value="3600">1 h</option>' +
      '</select>' +
    '</div>' +
    '<button class="btn-primary" id="btn-save" style="width:100%;">Enregistrer</button>' +
  '</div>';
  app.innerHTML = html;

  document.getElementById('btn-back').addEventListener('click', function() { Router.navigate('taches'); });
  document.getElementById('btn-save').addEventListener('click', function() {
    var title = document.getElementById('task-title').value.trim();
    if (!title) { showToast('Ajoute un titre'); return; }
    var listId = document.getElementById('task-list').value;
    var duration = parseInt(document.getElementById('task-duration').value);
    var task = {
      id: Store.generateId(),
      title: title,
      listId: listId,
      duration: duration,
      steps: [{ text: 'Commencer ' + title, seconds: Math.min(duration, 300) }],
      created: Date.now(),
      completed: null
    };
    State.data.tasks.push(task);
    Store.save();
    showToast('Tâche ajoutée !');
    Router.navigate('taches');
  });
}

// Écran Parcours
function renderParcours() {
  var app = document.getElementById('app');
  var sessions = State.data.sessions;
  var tasks = State.data.tasks;
  var totalMinutes = 0;
  sessions.forEach(function(s) { totalMinutes += Math.floor((s.realDuration || 0) / 60); });
  var completedTasks = tasks.filter(function(t) { return t.completed; }).length;
  var activeDays = {};
  sessions.forEach(function(s) { if (s.date) activeDays[s.date] = true; });

  var html = '<div class="screen"><div class="screen-header"><h1 class="screen-title">Parcours</h1></div>' +
    '<div class="stats-grid">' +
      '<div class="stat-card"><div class="stat-card-value">' + completedTasks + '</div><div class="stat-card-label">Tâches terminées</div></div>' +
      '<div class="stat-card"><div class="stat-card-value">' + formatDuration(totalMinutes * 60) + '</div><div class="stat-card-label">Temps total</div></div>' +
      '<div class="stat-card"><div class="stat-card-value">' + Object.keys(activeDays).length + '</div><div class="stat-card-label">Jours actifs</div></div>' +
    '</div>' +
    '<div class="card" style="margin-bottom:24px;">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><span style="font-size:18px;font-weight:800;">Niveau ' + State.data.level + '</span><span style="font-size:14px;font-weight:600;color:var(--text-secondary);">' + State.data.points + ' pts</span></div>' +
      '<div class="progress-bar"><div class="progress-bar-fill" style="width:' + (State.data.points % 100) + '%"></div></div>' +
    '</div>' +
    '<div class="section"><div class="section-header"><h3 class="section-title">Mes badges</h3><button class="section-link">Tout voir</button></div>' +
      '<div class="badges-grid">';
  Badges.slice(0, 4).forEach(function(badge) {
    var unlocked = State.data.badges[badge.id];
    html += '<div class="badge-card' + (unlocked ? '' : ' locked') + '">' + renderBadgeSvg(badge) + '<div class="badge-card-name">' + badge.name + '</div><div class="badge-card-condition">' + (unlocked ? 'Débloqué' : badge.condition) + '</div></div>';
  });
  html += '</div></div>' +
    '<div class="section"><div class="section-header"><h3 class="section-title">Historique des sessions</h3></div>';
  if (sessions.length === 0) {
    html += '<div class="card" style="text-align:center;padding:30px;"><p style="color:var(--text-secondary);">Ton parcours commence ici.</p></div>';
  } else {
    sessions.slice(-3).reverse().forEach(function(s) {
      html += '<div class="task-card" style="padding:14px 20px;"><div class="task-card-content"><div class="task-card-title">' + (s.taskTitle || 'Session') + '</div><div class="task-card-subtitle">' + s.date + '</div></div><div style="padding:6px 14px;background:var(--nav-active-bg);border-radius:12px;font-size:14px;font-weight:700;color:var(--accent-dark);">' + formatDuration(s.realDuration || 0) + '</div></div>';
    });
  }
  html += '</div></div>';
  app.innerHTML = html;
}

function showThemePicker() {
  var themes = [
    { id: 'clair', name: 'Clair', desc: 'Doux et lumineux' },
    { id: 'nuit', name: 'Nuit', desc: 'Sombre et reposant' },
    { id: 'galaxie', name: 'Galaxie', desc: 'Cosmique et inspirant' },
    { id: 'chaleureux', name: 'Chaleureux', desc: 'Doré et confortable' }
  ];
  var current = State.data.settings.theme;
  var html = '<div style="padding:20px;"><h3 style="font-size:20px;font-weight:800;margin-bottom:20px;">Choisis ton apparence</h3>';
  themes.forEach(function(t) {
    html += '<div class="theme-option' + (current === t.id ? ' active' : '') + '" data-theme-id="' + t.id + '" style="display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;cursor:pointer;margin-bottom:8px;background:' + (current === t.id ? 'var(--nav-active-bg)' : 'var(--surface)') + ';">' +
      '<div class="theme-preview ' + t.id + '" style="width:48px;height:48px;border-radius:12px;flex-shrink:0;"></div>' +
      '<div style="flex:1;"><div style="font-size:16px;font-weight:700;">' + t.name + '</div><div style="font-size:13px;color:var(--text-secondary);">' + t.desc + '</div></div>' +
    '</div>';
  });
  html += '</div>';

  var sheet = document.createElement('div');
  sheet.className = 'sheet-overlay';
  sheet.innerHTML = '<div class="sheet">' + html + '</div>';
  sheet.addEventListener('click', function(e) { if (e.target === sheet) sheet.remove(); });
  document.body.appendChild(sheet);

  var options = sheet.querySelectorAll('.theme-option');
  options.forEach(function(opt) {
    opt.addEventListener('click', function() {
      var themeId = opt.getAttribute('data-theme-id');
      State.data.settings.theme = themeId;
      document.documentElement.setAttribute('data-theme', themeId);
      Store.save();
      sheet.remove();
      showToast('Thème appliqué !');
    });
  });
}

// Écran Tutoriel
function renderTutorial() {
  var app = document.getElementById('app');
  var nav = document.getElementById('bottom-nav');
  nav.style.display = 'none';

  var step = State.data.tutorial.step || 0;
  var totalSteps = 5;
  var progress = ((step + 1) / totalSteps) * 100;

  var html = '<div class="tutorial-screen">' +
    '<div class="tutorial-progress"><div class="tutorial-progress-fill" style="width:' + progress + '%"></div></div>' +
    '<div class="tutorial-content">';

  if (step === 0) {
    html += '<h2 class="tutorial-title">Salut !</h2><p class="tutorial-text">Je suis là pour t\'aider à commencer, doucement.<br><br>Un seul bouton. Pas de pression. On y va à ton rythme.</p>' +
      '<div class="start-button-wrapper" style="margin:32px auto;"><button class="start-button" id="tuto-start">START</button></div>' +
      '<div class="tutorial-actions"><button class="btn-secondary" id="tuto-skip">Passer</button><button class="btn-primary" id="tuto-next">Continuer</button></div>';
  } else if (step === 1) {
    html += '<h2 class="tutorial-title">1 appui</h2><p class="tutorial-text">On passe à l\'étape suivante.</p>' +
      '<div class="start-button-wrapper" style="margin:32px auto;"><button class="start-button" id="tuto-tap">START</button></div>' +
      '<div class="tutorial-actions"><button class="btn-primary" id="tuto-next" style="flex:1;">Parfait, continuons</button></div>';
  } else if (step === 2) {
    html += '<h2 class="tutorial-title">2 appuis</h2><p class="tutorial-text">Tu as terminé, bravo.</p>' +
      '<div class="start-button-wrapper" style="margin:32px auto;"><button class="start-button" id="tuto-double">START</button></div>' +
      '<div class="tutorial-actions"><button class="btn-primary" id="tuto-next" style="flex:1;">Super, continuons</button></div>';
  } else if (step === 3) {
    html += '<h2 class="tutorial-title">Appui long</h2><p class="tutorial-text">Une pause, sans pression.</p>' +
      '<div class="start-button-wrapper" style="margin:32px auto;"><button class="start-button" id="tuto-long">START</button></div>' +
      '<div class="tutorial-actions"><button class="btn-primary" id="tuto-next" style="flex:1;">Compris, continuons</button></div>';
  } else if (step === 4) {
    html += '<h2 class="tutorial-title">Comment t\'appelles-tu ?</h2>' +
      '<input type="text" class="input-field" id="tuto-name" placeholder="Ton prénom (facultatif)" style="max-width:300px;margin:20px auto;display:block;">' +
      '<div class="tutorial-actions"><button class="btn-secondary" id="tuto-skip-name">Passer</button><button class="btn-primary" id="tuto-finish">C\'est parti</button></div>';
  }

  html += '</div></div>';
  app.innerHTML = html;

  document.getElementById('tuto-next').addEventListener('click', function() {
    State.data.tutorial.step = step + 1;
    Store.save();
    renderTutorial();
  });
  if (document.getElementById('tuto-skip')) {
    document.getElementById('tuto-skip').addEventListener('click', function() {
      State.data.tutorial.completed = true;
      Store.save();
      nav.style.display = 'flex';
      Router.navigate('accueil');
    });
  }
  if (document.getElementById('tuto-finish')) {
    document.getElementById('tuto-finish').addEventListener('click', function() {
      var name = document.getElementById('tuto-name').value.trim();
      if (name) State.data.profile.name = name;
      State.data.tutorial.completed = true;
      Store.save();
      nav.style.display = 'flex';
      Router.navigate('accueil');
    });
  }
  if (document.getElementById('tuto-skip-name')) {
    document.getElementById('tuto-skip-name').addEventListener('click', function() {
      State.data.tutorial.completed = true;
      Store.save();
      nav.style.display = 'flex';
      Router.navigate('accueil');
    });
  }

  var startBtns = ['tuto-start', 'tuto-tap', 'tuto-double', 'tuto-long'];
  startBtns.forEach(function(id) {
    var btn = document.getElementById(id);
    if (btn) {
      btn.addEventListener('click', function() {
        btn.style.transform = 'scale(0.95)';
        setTimeout(function() { btn.style.transform = ''; }, 150);
      });
    }
  });
}

// Initialisation
(function() {
  // Appliquer le thème sauvegardé AVANT affichage
  try {
    var savedTheme = localStorage.getItem('clic_theme');
    if (savedTheme && ['clair', 'nuit', 'galaxie', 'chaleureux'].indexOf(savedTheme) !== -1) {
      document.documentElement.setAttribute('data-theme', savedTheme);
    }
  } catch(e) {}

  Store.load();
  State.recalculatePoints();

  // Routes
  Router.register('accueil', renderHome);
  Router.register('taches', renderTasks);
  Router.register('creer', renderCreate);
  Router.register('parcours', renderParcours);
  Router.register('profil', renderProfile);
  Router.register('avatar', renderAvatar);
  Router.register('bloque', renderBloque);
  Router.register('tuto', renderTutorial);
  Router.register('legal', renderLegal);
  Router.register('privacy', renderPrivacy);
  Router.register('modeles', renderModels);

  // Vérifier si le tuto doit s'afficher
  if (!State.data.tutorial.completed) {
    Router.register('accueil', function() {
      renderTutorial();
    });
  }

  Router.init();
})();
