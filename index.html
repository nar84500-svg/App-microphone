<!DOCTYPE html>
<html lang="fr" data-theme="clair">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FF6B0F">
<title>Clic — Commence simplement</title>
<style>
@font-face{font-family:'Nunito';font-weight:400;font-display:swap;src:local('Nunito')}
@font-face{font-family:'Nunito';font-weight:600;font-display:swap;src:local('Nunito SemiBold')}
@font-face{font-family:'Nunito';font-weight:700;font-display:swap;src:local('Nunito Bold')}
@font-face{font-family:'Nunito';font-weight:800;font-display:swap;src:local('Nunito ExtraBold')}
@font-face{font-family:'Caveat';font-weight:700;font-display:swap;src:local('Caveat Bold')}

:root,[data-theme="clair"]{
--bg-top:#FFF3EF;--bg-bottom:#FFE6EA;--blob-1:#FFD3C2;--blob-2:#FFC9D6;
--surface:rgba(255,255,255,.78);--surface-border:rgba(255,255,255,.9);--surface-solid:#fff;
--text:#3A1A12;--text-secondary:#7A5446;--text-on-accent:#fff;
--accent:#FF6B0F;--ag1:#FF7A1A;--ag2:#F25A00;--accent-dark:#B8420A;--accent-halo:rgba(255,107,15,.25);
--line:rgba(58,26,18,.08);--shadow:rgba(180,90,60,.10);
--c-orange:#FF6B0F;--c-orange-t:#B8420A;--c-amber:#F2A300;--c-amber-t:#8A5A00;
--c-peach:#F48A57;--c-peach-t:#A8501F;--c-magenta:#C43AA5;--c-magenta-t:#9A2A82;
--nav-bg:rgba(255,255,255,.92);--nav-active-bg:#FFE8DC;--nav-active-text:#B8420A;--nav-inactive:#7A5446;
--success:#3FA24A;--success-bg:#E3F5E1;--warning-bg:#FFF0CC;
}
[data-theme="nuit"]{--bg-top:#17120F;--bg-bottom:#1F1612;--blob-1:#2A1F1A;--blob-2:#2A1A20;--surface:rgba(36,28,23,.85);--surface-border:rgba(255,255,255,.1);--surface-solid:#241C17;--text:#F6EBDD;--text-secondary:#C9B8A6;--accent:#FF8A3D;--ag1:#FF9A55;--ag2:#E06B20;--accent-dark:#FFB080;--accent-halo:rgba(255,138,61,.3);--line:rgba(255,255,255,.1);--shadow:rgba(0,0,0,.3);--c-orange:#FF8A3D;--c-orange-t:#FFB080;--c-amber:#FFC04D;--c-amber-t:#FFD880;--c-peach:#FF9A6B;--c-peach-t:#FFC0A0;--c-magenta:#D860B8;--c-magenta-t:#E890D0;--nav-bg:rgba(36,28,23,.95);--nav-active-bg:rgba(255,138,61,.2);--nav-active-text:#FF8A3D;--nav-inactive:#C9B8A6;--success:#5FD47A;--success-bg:rgba(95,212,122,.15);--warning-bg:rgba(255,192,77,.15)}
[data-theme="galaxie"]{--bg-top:#14142B;--bg-bottom:#1F1B3D;--blob-1:#2A2550;--blob-2:#352050;--surface:rgba(38,38,74,.85);--surface-border:rgba(255,255,255,.12);--surface-solid:#26264A;--text:#F3EEFF;--text-secondary:#C4BCE0;--accent:#FF8F66;--ag1:#FFA080;--ag2:#E07040;--accent-dark:#FFB899;--accent-halo:rgba(255,143,102,.3);--line:rgba(255,255,255,.1);--shadow:rgba(0,0,0,.35);--c-orange:#FF8F66;--c-orange-t:#FFB899;--c-amber:#FFC066;--c-amber-t:#FFD899;--c-peach:#FFA080;--c-peach-t:#FFC8B0;--c-magenta:#C870D0;--c-magenta-t:#DCA0E0;--nav-bg:rgba(38,38,74,.95);--nav-active-bg:rgba(255,143,102,.2);--nav-active-text:#FF8F66;--nav-inactive:#C4BCE0;--success:#70D890;--success-bg:rgba(112,216,144,.15);--warning-bg:rgba(255,192,102,.15)}
[data-theme="chaleureux"]{--bg-top:#F7EBD8;--bg-bottom:#F0DFC4;--blob-1:#E8D4B0;--blob-2:#E0C8A0;--surface:rgba(255,249,238,.85);--surface-border:rgba(255,255,255,.7);--surface-solid:#FFF9EE;--text:#3A2A1B;--text-secondary:#6F5A44;--accent:#E0641E;--ag1:#E87830;--ag2:#C85010;--accent-dark:#B8470F;--accent-halo:rgba(224,100,30,.25);--line:rgba(58,42,27,.1);--shadow:rgba(120,80,40,.12);--c-orange:#E0641E;--c-orange-t:#B8470F;--c-amber:#D49020;--c-amber-t:#A06810;--c-peach:#D87840;--c-peach-t:#A85020;--c-magenta:#B04090;--c-magenta-t:#802060;--nav-bg:rgba(255,249,238,.95);--nav-active-bg:#F5DCC0;--nav-active-text:#B8470F;--nav-inactive:#6F5A44;--success:#3FA24A;--success-bg:#E3F5E1;--warning-bg:#FFF0CC}

*{box-sizing:border-box;margin:0;padding:0}
html{height:100dvh;overflow:hidden;-webkit-text-size-adjust:100%}
body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:500;color:var(--text);background:linear-gradient(180deg,var(--bg-top),var(--bg-bottom));min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.bg-blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.4;pointer-events:none;z-index:0}
.bg-blob-1{width:340px;height:340px;background:var(--blob-1);top:-90px;right:-70px}
.bg-blob-2{width:300px;height:300px;background:var(--blob-2);bottom:120px;left:-90px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
button{font-family:inherit}

.screen{position:relative;z-index:1;min-height:100dvh;padding:16px 20px calc(104px + env(safe-area-inset-bottom));overflow-y:auto}
.screen-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.screen-title{font-size:30px;font-weight:800;color:var(--text)}
.row{display:flex;align-items:center;gap:12px}
.spacer{flex:1}

.card{background:var(--surface);border:1px solid var(--surface-border);border-radius:24px;box-shadow:0 8px 24px var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:20px}
.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--ag1),var(--ag2));color:#fff;border:none;border-radius:16px;padding:14px 26px;font-size:16px;font-weight:700;cursor:pointer;min-height:48px;transition:transform .15s,box-shadow .15s}
.btn-primary:active{transform:scale(.97)}
.btn-secondary{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface-solid);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:14px 26px;font-size:16px;font-weight:700;cursor:pointer;min-height:48px;transition:background .15s}
.btn-secondary:active{background:var(--nav-active-bg)}
.btn-round{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--ag1),var(--ag2));color:#fff;border:none;cursor:pointer;flex-shrink:0;transition:transform .15s}
.btn-round:active{transform:scale(.92)}
.btn-round svg{width:22px;height:22px}
.btn-back{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--surface-border);cursor:pointer;flex-shrink:0}
.btn-back svg{width:22px;height:22px;color:var(--text)}
.btn-icon{width:46px;height:46px;border-radius:50%;background:var(--surface);border:1px solid var(--surface-border);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.btn-icon svg{width:22px;height:22px;color:var(--text)}
.btn-icon .dot{position:absolute;top:9px;right:9px;width:11px;height:11px;background:var(--accent);border-radius:50%;border:2px solid var(--surface-solid)}

.input-field{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:14px;font-family:inherit;font-size:16px;font-weight:500;color:var(--text);background:var(--surface-solid);min-height:48px;outline:none}
.input-field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-halo)}
.input-field::placeholder{color:var(--text-secondary);opacity:.7}

.progress{width:100%;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--ag1),var(--ag2));border-radius:5px;transition:width .3s}

.bottom-nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:440px;height:72px;background:var(--nav-bg);border:1px solid var(--surface-border);border-radius:36px;box-shadow:0 8px 32px var(--shadow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-around;padding:0 6px;padding-bottom:env(safe-area-inset-bottom);z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 10px;border-radius:18px;cursor:pointer;background:none;border:none;min-width:44px;min-height:44px}
.nav-item.active{background:var(--nav-active-bg)}
.nav-item .ic{width:24px;height:24px;color:var(--nav-inactive)}
.nav-item.active .ic{color:var(--nav-active-text)}
.nav-item .lb{font-size:11px;font-weight:700;color:var(--nav-inactive)}
.nav-item.active .lb{color:var(--nav-active-text)}
.nav-item svg{display:block}
.nav-center{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--ag1),var(--ag2));border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:-16px;box-shadow:0 4px 16px var(--accent-halo);z-index:2}
.nav-center svg{width:26px;height:26px;color:#fff}

.home-head{display:flex;align-items:center;justify-content:space-between;padding:8px 0 16px}
.logo{width:48px;height:48px;background:var(--surface-solid);border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px var(--shadow)}
.logo svg{width:30px;height:30px}
.greet{font-size:30px;font-weight:800;color:var(--text);margin:6px 0 2px}
.greet-sub{font-size:15px;font-weight:500;color:var(--text-secondary);margin-bottom:18px}

.search{display:flex;align-items:center;gap:10px;background:var(--surface-solid);border:1px solid var(--line);border-radius:16px;padding:13px 16px;margin-bottom:18px}
.search svg{width:20px;height:20px;color:var(--text-secondary);flex-shrink:0}
.search input{flex:1;border:none;background:none;font-family:inherit;font-size:15px;font-weight:500;color:var(--text);outline:none}

.focus-card{background:linear-gradient(135deg,rgba(255,190,180,.35),rgba(255,180,205,.25));border:1px solid var(--surface-border);border-radius:24px;padding:18px;margin-bottom:22px;box-shadow:0 8px 24px var(--shadow)}
.focus-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.focus-title{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;color:var(--text)}
.focus-title svg{width:26px;height:26px;color:#E8405C}
.pill{background:var(--surface-solid);border:none;border-radius:12px;padding:7px 14px;font-size:13px;font-weight:700;color:var(--text);cursor:pointer}
.focus-stat{font-size:15px;font-weight:600;color:var(--text);margin-bottom:10px}
.focus-bar{display:flex;align-items:center;gap:12px}
.focus-bar .progress{flex:1}
.focus-pct{font-size:18px;font-weight:800;color:var(--text)}

.section-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.section-title{font-size:20px;font-weight:800;color:var(--text)}
.link{background:none;border:none;color:var(--accent);font-size:14px;font-weight:700;cursor:pointer;padding:6px}

.resume{background:linear-gradient(135deg,rgba(220,180,255,.25),rgba(255,200,170,.3));border:1px solid var(--surface-border);border-radius:24px;padding:18px;display:flex;align-items:center;gap:14px;margin-bottom:22px;cursor:pointer;box-shadow:0 8px 24px var(--shadow)}
.resume .rc{flex:1;min-width:0}
.resume .rt{font-size:18px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resume .rs{font-size:14px;font-weight:500;color:var(--text-secondary);margin:2px 0}
.resume .rtime{display:flex;align-items:center;gap:5px;font-size:14px;font-weight:600;color:var(--text)}
.resume .rtime svg{width:16px;height:16px}
.resume .rbtn{display:flex;align-items:center;gap:6px;padding:10px 16px;background:var(--surface-solid);border:1px solid var(--line);border-radius:14px;font-size:14px;font-weight:700;color:var(--accent);cursor:pointer;flex-shrink:0}
.resume .rbtn svg{width:14px;height:14px}

.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qa-item{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;background:var(--surface);border:1px solid var(--surface-border);border-radius:18px;cursor:pointer;transition:transform .15s}
.qa-item:active{transform:scale(.96)}
.qa-ic{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center}
.qa-ic svg{width:22px;height:22px}
.qa-lb{font-size:11px;font-weight:700;color:var(--text);text-align:center;line-height:1.2}

.bloque-line{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:22px}
.bloque-line span{font-size:14px;font-weight:600;color:var(--text-secondary)}
.bloque-line button{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--surface-border);display:flex;align-items:center;justify-content:center;cursor:pointer}
.bloque-line button svg{width:20px;height:20px;color:var(--accent)}

.task-card{background:var(--surface);border:1px solid var(--surface-border);border-radius:24px;padding:18px 18px 18px 22px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:transform .15s;margin-bottom:12px;position:relative;overflow:hidden;box-shadow:0 8px 24px var(--shadow)}
.task-card:active{transform:scale(.98)}
.tc-bar{position:absolute;left:8px;top:16px;bottom:16px;width:5px;border-radius:3px}
.tc-bar.orange{background:var(--c-orange)}.tc-bar.amber{background:var(--c-amber)}.tc-bar.peach{background:var(--c-peach)}.tc-bar.magenta{background:var(--c-magenta)}
.tc-cat{font-size:13px;font-weight:700;margin-bottom:3px}
.tc-cat.orange{color:var(--c-orange-t)}.tc-cat.amber{color:var(--c-amber-t)}.tc-cat.peach{color:var(--c-peach-t)}.tc-cat.magenta{color:var(--c-magenta-t)}
.tc-title{font-size:18px;font-weight:800;color:var(--text);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-sub{font-size:14px;font-weight:500;color:var(--text-secondary)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--surface-border);border-radius:20px;padding:14px 8px;text-align:center}
.stat svg{width:24px;height:24px;margin-bottom:6px}
.stat .v{font-size:22px;font-weight:800;color:var(--text);line-height:1.1}
.stat .l{font-size:11px;font-weight:600;color:var(--text-secondary);margin-top:3px;line-height:1.2}

.set-list{background:var(--surface);border:1px solid var(--surface-border);border-radius:20px;overflow:hidden;margin-bottom:14px}
.set-row{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line);cursor:pointer;min-height:48px}
.set-row:last-child{border-bottom:none}
.set-row:active{background:var(--nav-active-bg)}
.set-row .ri{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.set-row .ri svg{width:18px;height:18px}
.set-row .rl{flex:1;font-size:16px;font-weight:600;color:var(--text)}
.set-row .rv{font-size:14px;font-weight:500;color:var(--text-secondary)}
.set-row .ch{width:18px;height:18px;color:var(--text-secondary)}

.badge-card{background:var(--surface);border:1px solid var(--surface-border);border-radius:20px;padding:14px;text-align:center}
.badge-card.locked{opacity:.55;filter:grayscale(1)}
.badge-card svg{width:74px;height:74px;margin-bottom:6px}
.badge-card .bn{font-size:12px;font-weight:700;color:var(--text)}
.badge-card .bc{font-size:10px;font-weight:500;color:var(--text-secondary);margin-top:3px;line-height:1.3}
.badges-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.badges-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}

.sess-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.sess-row:last-child{border-bottom:none}
.sess-ic{width:40px;height:40px;border-radius:12px;background:var(--nav-active-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sess-ic svg{width:18px;height:18px;color:var(--accent)}
.sess-c{flex:1;min-width:0}
.sess-t{font-size:16px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess-d{font-size:12px;font-weight:500;color:var(--text-secondary);margin-top:2px}
.sess-dur{padding:6px 12px;background:var(--nav-active-bg);border-radius:12px;font-size:13px;font-weight:700;color:var(--accent-dark);flex-shrink:0}

.avatar-bg{width:130px;height:130px;border-radius:50%;background:linear-gradient(135deg,rgba(255,200,180,.45),rgba(255,180,220,.35));display:flex;align-items:center;justify-content:center;margin:0 auto 14px;position:relative}
.avatar-bg svg{width:96px;height:96px}
.avatar-edit{position:absolute;bottom:6px;right:6px;width:34px;height:34px;border-radius:50%;background:var(--surface-solid);border:2px solid var(--surface-border);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px var(--shadow)}
.avatar-edit svg{width:15px;height:15px;color:var(--text-secondary)}
.p-name{font-size:26px;font-weight:800;color:var(--text);text-align:center}
.p-motto{font-size:15px;font-weight:500;color:var(--text-secondary);text-align:center;margin-top:4px}

.av-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px}
.av-opt{background:var(--surface);border:2px solid transparent;border-radius:20px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;position:relative}
.av-opt:active{background:var(--nav-active-bg)}
.av-opt.sel{border-color:var(--accent);background:var(--nav-active-bg)}
.av-opt svg{width:60px;height:60px}
.av-opt .an{font-size:12px;font-weight:700;color:var(--text);text-align:center}
.av-opt .ck{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--accent);display:none;align-items:center;justify-content:center}
.av-opt.sel .ck{display:flex}
.av-opt .ck svg{width:13px;height:13px;color:#fff}
.av-preview{background:var(--surface);border:1px solid var(--surface-border);border-radius:20px;padding:18px;display:flex;align-items:center;gap:14px;margin-bottom:18px}
.av-preview svg{width:64px;height:64px}
.av-preview .lbl{font-size:13px;font-weight:600;color:var(--text-secondary)}
.av-preview .nm{font-size:19px;font-weight:800;color:var(--text);margin:2px 0 6px}
.av-preview .tag{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;background:var(--nav-active-bg);border-radius:12px;font-size:12px;font-weight:700;color:var(--accent-dark)}
.av-preview .tag svg{width:13px;height:13px}

/* Session */
.session{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#3A2E27,#1A110D);z-index:2000;display:flex;flex-direction:column;padding:18px;padding-top:calc(18px + env(safe-area-inset-top));padding-bottom:calc(18px + env(safe-area-inset-bottom));overflow-y:auto}
.s-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.s-btn{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.1);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.s-btn svg{width:22px;height:22px;color:#fff}
.s-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.s-task{font-family:'Caveat',cursive;font-size:30px;font-weight:700;color:#fff}
.s-step{font-size:15px;font-weight:600;color:rgba(255,255,255,.65)}
.s-steptext{font-size:18px;font-weight:600;color:rgba(255,255,255,.92);max-width:300px;line-height:1.4}
.s-dots{display:flex;gap:7px;margin:4px 0}
.s-dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.25)}
.s-dot.done{background:var(--accent)}
.s-dot.now{background:#fff}
.s-timer{font-size:46px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:1px;margin:6px 0}
.start-wrap{position:relative;width:160px;height:160px;display:flex;align-items:center;justify-content:center;margin-top:8px}
.start-ring{position:absolute;inset:0}
.start-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.start-ring circle{fill:none;stroke-width:6}
.ring-bg{stroke:rgba(255,255,255,.12)}
.ring-pg{stroke:var(--accent);stroke-linecap:round}
.start-btn{width:112px;height:112px;border-radius:50%;background:linear-gradient(135deg,var(--ag1),var(--ag2));border:none;cursor:pointer;font-family:'Caveat',cursive;font-size:32px;font-weight:700;color:#fff;box-shadow:0 8px 32px rgba(255,107,15,.4);animation:breathe 3s ease-in-out infinite;z-index:1}
.start-btn:active{transform:scale(.94);animation:none}
@keyframes breathe{0%,100%{box-shadow:0 8px 32px rgba(255,107,15,.35)}50%{box-shadow:0 8px 52px rgba(255,107,15,.55)}}
.s-sum{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;color:#fff}
.s-sum h2{font-size:26px;font-weight:800}
.s-sum p{font-size:16px;color:rgba(255,255,255,.7)}
.s-sum .acts{display:flex;flex-direction:column;gap:10px;width:100%;max-width:280px;margin-top:10px}
.s-sum .btn-secondary{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.2)}

/* Tuto */
.tuto{position:fixed;inset:0;z-index:3000;display:flex;flex-direction:column;padding:18px;padding-top:calc(18px + env(safe-area-inset-top));padding-bottom:calc(18px + env(safe-area-inset-bottom));overflow-y:auto}
.tuto-prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:18px}
.tuto-prog .progress-fill{height:100%;background:var(--accent);border-radius:3px}
.tuto-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.tuto-body h2{font-size:28px;font-weight:800;color:var(--text);line-height:1.2}
.tuto-body p{font-size:16px;font-weight:500;color:var(--text-secondary);line-height:1.6;max-width:340px}
.tuto-foot{display:flex;gap:12px;margin-top:18px}
.tuto-foot button{flex:1}
.q-card{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--surface-border);border-radius:18px;padding:14px 16px;margin-bottom:10px;text-align:left;cursor:pointer;transition:border-color .15s,background .15s}
.q-card:active{background:var(--nav-active-bg)}
.q-card.sel{border-color:var(--accent);background:var(--nav-active-bg)}
.q-card .qt{font-size:15px;font-weight:700;color:var(--text)}
.q-card .qd{font-size:13px;font-weight:500;color:var(--text-secondary);margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 14px;max-width:340px}
.chip{padding:9px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:700;color:var(--text);cursor:pointer}
.chip.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.tuto-feedback{font-size:16px;font-weight:700;color:var(--accent);min-height:22px}

/* Sheets / toast / confirm */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--surface-solid);border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:500px;max-height:86dvh;overflow-y:auto;animation:up .25s}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:40px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 16px}
.confirm{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1001;display:flex;align-items:center;justify-content:center;padding:20px}
.confirm-box{background:var(--surface-solid);border-radius:24px;padding:26px 22px;max-width:340px;width:100%;text-align:center;box-shadow:0 16px 48px var(--shadow)}
.confirm-box h3{font-size:18px;font-weight:800;margin-bottom:10px;color:var(--text)}
.confirm-box p{font-size:14px;font-weight:500;color:var(--text-secondary);margin-bottom:22px;line-height:1.5}
.confirm-acts{display:flex;gap:10px}
.confirm-acts button{flex:1}
.toast-wrap{position:fixed;bottom:calc(104px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;width:calc(100% - 32px);max-width:400px;pointer-events:none}
.toast{background:var(--surface-solid);border:1px solid var(--line);border-radius:14px;padding:13px 16px;box-shadow:0 8px 24px var(--shadow);font-size:14px;font-weight:600;color:var(--text);display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:auto;animation:up .25s}
.toast button{background:none;border:none;color:var(--accent);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.empty{text-align:center;padding:30px 16px;color:var(--text-secondary)}
.empty svg{width:60px;height:60px;opacity:.35;margin-bottom:10px}
.empty h3{font-size:17px;font-weight:700;color:var(--text);margin-bottom:6px}
.empty p{font-size:14px;font-weight:500;line-height:1.5}
.theme-opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;cursor:pointer;margin-bottom:8px;border:2px solid transparent}
.theme-opt.sel{border-color:var(--accent);background:var(--nav-active-bg)}
.theme-prev{width:44px;height:44px;border-radius:12px;flex-shrink:0;border:1px solid var(--line)}
.theme-prev.clair{background:linear-gradient(135deg,#FFF3EF,#FFE6EA)}
.theme-prev.nuit{background:linear-gradient(135deg,#17120F,#241C17)}
.theme-prev.galaxie{background:linear-gradient(135deg,#14142B,#1F1B3D)}
.theme-prev.chaleureux{background:linear-gradient(135deg,#F7EBD8,#F0DFC4)}
.theme-opt .tn{font-size:16px;font-weight:700;color:var(--text)}
.theme-opt .td{font-size:13px;font-weight:500;color:var(--text-secondary)}
.note{font-size:12px;font-weight:500;color:var(--text-secondary);text-align:center;padding:14px;line-height:1.5;opacity:.8}
.legal p{font-size:15px;font-weight:500;color:var(--text-secondary);line-height:1.7;margin-bottom:14px}

@media(min-width:768px){.screen,.tuto{max-width:600px;margin:0 auto}.bottom-nav{max-width:480px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

var S=null,timerIv=null,timerStart=0,timerRemain=0,timerTotal=0,timerState='idle',tapCount=0,tapT=null;
function startSession(task){S={id:uid(),type:'simple',taskId:task.id,taskTitle:task.title,steps:(task.steps||[{text:'Commencer',sec:600}]).map(function(s){return {text:s.text,sec:s.sec,done:false};}),cur:0,start:Date.now(),planned:task.dur||1800,real:0,pauses:0,exits:0,exitDur:0,bloque:0,status:'running',date:todayStr()};beginTimer(S.planned);renderSession();}
function startMulti(tasks,total){S={id:uid(),type:'multi',tasks:tasks.map(function(t){return {taskId:t.id,title:t.title,cat:(D.lists.find(function(l){return l.id===t.listId;})||{}).color||'orange',planned:t.dur||600,real:0,done:false};}),cur:0,start:Date.now(),planned:total,real:0,pauses:0,exits:0,exitDur:0,bloque:0,status:'running',date:todayStr()};beginTimer(total);renderSession();}
function beginTimer(sec){timerTotal=sec;timerRemain=sec;timerStart=Date.now();timerState='running';clearInterval(timerIv);timerIv=setInterval(function(){if(timerState!=='running')return;var el=Math.floor((Date.now()-timerStart)/1000);timerRemain=Math.max(0,timerTotal-el);updateTimer();if(timerRemain<=0)endTimer();},250);}
function updateTimer(){var t=document.getElementById('st');if(t)t.textContent=fmtTimer(timerRemain);var ring=document.getElementById('rp');if(ring){var c=2*Math.PI*70;var p=timerTotal?timerRemain/timerTotal:0;ring.style.strokeDasharray=c;ring.style.strokeDashoffset=c*(1-p);}}
function endTimer(){clearInterval(timerIv);timerState='finished';playEnd();renderSessionEnd();}
function playEnd(){try{if(D.settings.sound==='silencieux')return;if('AudioContext' in window||'webkitAudioContext' in window){var AC=window.AudioContext||window.webkitAudioContext;var ac=new AC();var notes=D.settings.sound==='pulsation'?[440]:[523,659,784];notes.forEach(function(f,i){var o=ac.createOscillator();var g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(0.0001,ac.currentTime+i*0.18);g.gain.exponentialRampToValueAtTime(0.15,ac.currentTime+i*0.18+0.02);g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+i*0.18+0.4);o.start(ac.currentTime+i*0.18);o.stop(ac.currentTime+i*0.18+0.42);});}if(D.settings.vibration&&navigator.vibrate)navigator.vibrate([80,40,80]);}catch(e){}}
function renderSession(){showNav(false);var a=document.getElementById('app');var step=S.type==='simple'?S.steps[S.cur]:null;var totalSteps=S.type==='simple'?S.steps.length:S.tasks.length;var curIdx=S.type==='simple'?S.cur:S.cur;
var dots='';for(var i=0;i<totalSteps;i++){dots+='<span class="s-dot'+(i<curIdx?' done':i===curIdx?' now':'')+'"></span>';}
var stepText=S.type==='simple'?(step?step.text:''):(S.tasks[S.cur]?S.tasks[S.cur].title:'');
var mini='';if(S.type==='multi'){mini='<div style="width:100%;max-width:300px;margin-top:14px;">'+S.tasks.map(function(t,i){return '<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;margin-bottom:6px;'+(i===S.cur?'background:rgba(255,255,255,.12)':'')+'"><span style="width:10px;height:10px;border-radius:50%;background:'+(t.done?'#5FD47A':i===S.cur?'var(--accent)':'rgba(255,255,255,.3)')+'"></span><span style="font-size:14px;font-weight:'+(i===S.cur?'700':'500')+';color:rgba(255,255,255,.85);">'+esc(t.title)+'</span></div>';}).join('')+'</div>';}
a.innerHTML='<div class="session"><div class="s-top"><button class="s-btn" id="p">'+I.pause+'</button><button class="s-btn" id="b">'+I.bouee+'</button><button class="s-btn" id="q">'+I.croix+'</button></div>'+
'<div class="s-center"><div class="s-task">'+esc(S.taskTitle||(S.tasks&&S.tasks[S.cur]?S.tasks[S.cur].title:''))+'</div>'+
'<div class="s-step">Étape '+(curIdx+1)+' / '+totalSteps+'</div>'+
'<div class="s-steptext">'+esc(stepText)+'</div><div class="s-dots">'+dots+'</div>'+
'<div class="s-timer" id="st">'+fmtTimer(timerRemain)+'</div>'+
'<div class="start-wrap"><div class="start-ring"><svg viewBox="0 0 160 160"><circle class="ring-bg" cx="80" cy="80" r="70"/><circle class="ring-pg" id="rp" cx="80" cy="80" r="70"/></svg></div><button class="start-btn" id="start">START</button></div>'+mini+'</div></div>';
a.querySelector('#p').onclick=function(){togglePause();};
a.querySelector('#b').onclick=function(){S.bloque++;saveSession();go('bloque');};
a.querySelector('#q').onclick=function(){confirmBox('Quitter la session ?','Ton temps de travail est enregistré.',function(){quitSession();});};
a.querySelector('#start').onclick=function(){handleTap();};
updateTimer();
}
function handleTap(){tapCount++;if(tapCount===1){tapT=setTimeout(function(){tapCount=0;nextStep();},280);}else{clearTimeout(tapT);tapCount=0;completeTask();}}
function nextStep(){if(S.type==='simple'){if(S.steps[S.cur]){S.steps[S.cur].done=true;addPoints(1);}if(S.cur<S.steps.length-1){S.cur++;renderSession();}else{completeTask();}}else{if(S.tasks[S.cur])S.tasks[S.cur].done=true;addPoints(1);if(S.cur<S.tasks.length-1){S.cur++;renderSession();}else{completeTask();}}}
function completeTask(){var t=D.tasks.find(function(x){return x.id===S.taskId;});if(t){t.done=todayStr();if(t.steps)t.steps.forEach(function(s){s.done=true;});}addPoints(5);saveSession();endTimer();}
function togglePause(){if(timerState==='running'){timerState='paused';clearInterval(timerIv);S.pauses++;var pb=document.getElementById('p');if(pb)pb.innerHTML=I.play;}else if(timerState==='paused'){timerState='running';timerStart=Date.now()-(timerTotal-timerRemain)*1000;timerIv=setInterval(function(){if(timerState!=='running')return;var el=Math.floor((Date.now()-timerStart)/1000);timerRemain=Math.max(0,timerTotal-el);updateTimer();if(timerRemain<=0)endTimer();},250);var pb=document.getElementById('p');if(pb)pb.innerHTML=I.pause;}}
function quitSession(){clearInterval(timerIv);S.status='quit';S.real=Math.floor((Date.now()-S.start)/1000);D.sessions.push(S);save();recalcPoints();S=null;showNav(true);go('accueil');}
function renderSessionEnd(){var real=Math.floor((Date.now()-S.start)/1000);S.real=real;S.status='done';S.end=Date.now();D.sessions.push(S);save();recalcPoints();checkBadges();var a=document.getElementById('app');
a.innerHTML='<div class="session"><div class="s-sum"><h2>Bien joué.</h2><p>Tu as travaillé '+fmtDur(real)+'.</p><div class="acts"><button class="btn-primary" id="more">Continuer (+10 min)</button><button class="btn-secondary" id="next">Prochaine tâche</button><button class="btn-secondary" id="fin">Terminer</button></div></div></div>';
a.querySelector('#more').onclick=function(){beginTimer(600);renderSession();};
a.querySelector('#next').onclick=function(){var t=D.tasks.find(function(x){return !x.done&&x.id!==S.taskId;});if(t){startSession(t);}else{finish();}};
a.querySelector('#fin').onclick=finish;
function finish(){S=null;showNav(true);go('accueil');}
}
function saveSession(){if(S)Storage.saveSession(S);}
function resumeSession(){var run=D.sessions.find(function(s){return s.status==='running';});if(run){S=run;beginTimer(Math.max(1,run.planned-Math.floor((Date.now()-run.start)/1000)));renderSession();return true;}return false;}

exercices:{k:['exercice','td','probleme','calcul','maths'],s:['Lis l\'énoncé une première fois','Souligne les données','Écris ce qu\'on demande','Fais le premier calcul','Vérifie ton résultat','Passe à l\'exercice suivant','Relis ta copie','Note tes erreurs']},

contacter:{k:['mail','appeler','telephoner','dossier','formulaire','rendez','inscription','mutuelle'],s:['Ouvre un nouveau message','Écris seulement l\'objet','Écris la première phrase','Explique en 2 phrases','Relis et envoie','Note la date attendue','Prépare les documents','Vérifie tes coordonnées']},
projet:{k:['coder','programmer','projet','site','appli','dessiner','ter'],s:['Ouvre ton environnement','Liste les tâches restantes','Commence par la plus simple','Fais un premier jet','Teste ce que tu as fait','Note les problèmes','Cherche une solution','Avance d\'un petit pas']}

function classify(t){if(!t)return 'autre';var l=t.toLowerCase();for(var c in CATS){for(var i=0;i<CATS[c].k.length;i++){if(l.indexOf(CATS[c].k[i])!==-1)return c;}}return 'autre';}
function suggest(task,bloc){var c=classify(task);var bank=CATS[c]?CATS[c].s:['Définis la première action','Fais l\'action la plus simple','Avance d\'un petit pas','Note où tu t\'arrêtes'];var d=D.settings.stepDur<300?30:(D.settings.stepDur>1800?300:60);var out=[];
if(bloc==='gros'){out=[bank[0],bank[1],bank[2]].map(function(t){return {text:t,sec:d};});}
else if(bloc==='debut'){out=bank.slice(0,4).map(function(t){return {text:t,sec:d};});}
else if(bloc==='distrait'){out=[{text:'Éloigne ton téléphone',sec:30},{text:'Ferme les onglets inutiles',sec:30},{text:bank[0],sec:d},{text:bank[1],sec:d}];}
else if(bloc==='plat'){out=[{text:'Respire profondément 3 fois',sec:30},{text:bank[0],sec:d},{text:'Fais une pause si besoin',sec:60}];}
else if(bloc==='2min'){out=[{text:bank[0],sec:60},{text:bank[1]||'Avance encore',sec:60},{text:'Après 2 minutes, tu peux t\'arrêter',sec:30}];}
else{out=bank.slice(0,5).map(function(t){return {text:t,sec:d};});}
return out;}

function dailyQuests(){var today=todayStr();var done=D.tasks.filter(function(t){return t.done&&t.done.indexOf(today)===0;}).length;var mins=0;D.sessions.forEach(function(s){if(s.date===today)mins+=Math.floor((s.real||0)/60);});var steps=0;D.tasks.forEach(function(t){if(t.steps)t.steps.forEach(function(s){if(s.done&&s.doneDate===today)steps++;});});return [{title:'Terminer 1 tâche',progress:done,target:1,completed:done>=1},{title:'Travailler 15 minutes',progress:mins,target:15,completed:mins>=15},{title:'Valider 3 étapes',progress:steps,target:3,completed:steps>=3}];}
function weeklyQuests(){var mon=mondayStr();var days=activeDays();var mins=0;D.sessions.forEach(function(s){if(s.date>=mon)mins+=Math.floor((s.real||0)/60);});var done=D.tasks.filter(function(t){return t.done&&t.done>=mon;}).length;return [{title:'3 jours actifs',progress:days,target:3,completed:days>=3},{title:'Travailler 2 h',progress:mins,target:120,completed:mins>=120},{title:'Terminer 5 tâches',progress:done,target:5,completed:done>=5}];}

function boot(){try{
try{var th=localStorage.getItem('clic_theme');if(th&&['clair','nuit','galaxie','chaleureux'].indexOf(th)!==-1)document.documentElement.setAttribute('data-theme',th);}catch(e){}
load();recalcPoints();
if(!D.tutorial.done){startTutorial();}else{if(!resumeSession()){nav();}}
window.addEventListener('hashchange',function(){if(!D.tutorial.done)return;nav();});
document.addEventListener('visibilitychange',function(){if(S&&timerState==='running'&&document.hidden){S.exits++;S.exitStart=Date.now();}else if(S&&S.exitStart){S.exitDur+=Math.floor((Date.now()-S.exitStart)/1000);S.exitStart=0;}});
}catch(e){document.getElementById('app').innerHTML='<div class="screen"><div class="empty"><h3>Oups</h3><p>Recharge la page.</p></div></div>';}
}
boot();
</script>
</body>
